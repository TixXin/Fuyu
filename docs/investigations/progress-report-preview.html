<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>进度报告预览</title>
<style>
:root {
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in-out: cubic-bezier(0.45, 0, 0.55, 1);
  --fast: 120ms;
  --base: 160ms;
  --medium: 240ms;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --chrome-bg: rgba(255, 255, 255, .72);
  --chrome-text: #1b1d21;
  --chrome-muted: #6a6f78;
  --chrome-line: rgba(0, 0, 0, .1);
  --accent: #0a7fd1;
  --run: #1f7fd1;
  --wait: #c98a07;
  --done: #2f9a4e;
  --idle: #9aa0a8;
  --bad: #d64550;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --chrome-bg: rgba(12, 13, 16, .72);
  --chrome-text: #f3f1ec;
  --chrome-muted: #9a9ea6;
  --chrome-line: rgba(255, 255, 255, .1);
  --accent: #74d6ff;
  --run: #5aa9e6;
  --wait: #f5b83d;
  --done: #6cbf7f;
  --idle: #6b7079;
  --bad: #ef6b74;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --chrome-bg: rgba(12, 13, 16, .72);
    --chrome-text: #f3f1ec;
    --chrome-muted: #9a9ea6;
    --chrome-line: rgba(255, 255, 255, .1);
    --accent: #74d6ff;
    --run: #5aa9e6;
    --wait: #f5b83d;
    --done: #6cbf7f;
    --idle: #6b7079;
    --bad: #ef6b74;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 14px/1.5 var(--font); color: var(--chrome-text); background: #888; overflow-x: hidden; }
button { font: inherit; color: inherit; }
code { font-family: var(--mono); }

.switch { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px; background: var(--chrome-bg); backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%); border-bottom: 1px solid var(--chrome-line); }
.switch h1 { font-size: 14px; margin: 0; font-weight: 600; }
.switch .hint { color: var(--chrome-muted); font-size: 12px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--chrome-line); }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; white-space: nowrap; transition: background-color var(--fast) var(--ease), color var(--fast) var(--ease); }
.seg button:hover { background: var(--chrome-line); }
.seg button[aria-pressed="true"] { background: var(--chrome-text); color: var(--chrome-bg); }
.seg button[aria-pressed="true"] { color: #fff; }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { color: #0c0d10; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { color: #0c0d10; } }
.switch .grow { flex: 1; }

.view { display: none; min-height: calc(100vh - 52px); }
.view.on { display: block; animation: view-in var(--medium) var(--ease-out) backwards; }
@keyframes view-in { from { opacity: 0; } }

.lamp { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--idle); }
.s-running .lamp, .lamp.running { background: var(--run); animation: breathe 1.6s var(--ease-in-out) infinite alternate; }
.s-background .lamp, .lamp.background { background: transparent; box-shadow: inset 0 0 0 2px var(--run); }
.s-waiting .lamp, .lamp.waiting { background: var(--wait); animation: breathe 1.1s var(--ease-in-out) infinite alternate; box-shadow: 0 0 0 4px color-mix(in srgb, var(--wait) 22%, transparent); }
.s-done .lamp, .lamp.done { background: var(--done); }
@keyframes breathe { from { opacity: 1; } to { opacity: .4; } }
@media (prefers-reduced-motion: reduce) {
  .view.on, .s-running .lamp, .lamp.running, .s-waiting .lamp, .lamp.waiting, .c-halo { animation: none; }
}

/* ============ A 群岛 ============ */
.va {
  --sea: #e4f0f8;
  --sea-2: #cfe3f1;
  --contour: rgba(10, 127, 209, .07);
  --card: #ffffff;
  --card-line: rgba(10, 40, 70, .08);
  --card-shadow: 0 1px 2px rgba(10, 40, 70, .06), 0 12px 32px -12px rgba(10, 40, 70, .22);
  --t1: #12171d;
  --t2: #56606b;
  --t3: #8a939d;
  --chip: rgba(10, 40, 70, .05);
  --isl: #030303;
  --isl-t1: rgba(248, 246, 240, .96);
  --isl-t2: rgba(248, 246, 240, .68);
  --isl-t3: rgba(248, 246, 240, .54);
  --isl-row: rgba(248, 246, 240, .06);
  color: var(--t1);
  background:
    radial-gradient(900px 520px at 50% -120px, rgba(255, 255, 255, .9), transparent 70%),
    repeating-radial-gradient(circle at 18% 42%, transparent 0 46px, var(--contour) 47px 48px),
    repeating-radial-gradient(circle at 86% 78%, transparent 0 58px, var(--contour) 59px 60px),
    linear-gradient(180deg, var(--sea), var(--sea-2));
  background-attachment: fixed;
}
:root[data-theme="dark"] .va {
  --sea: #071523; --sea-2: #04101b; --contour: rgba(116, 214, 255, .045);
  --card: #0b0c0e; --card-line: rgba(255, 255, 255, .07);
  --card-shadow: 0 0 0 1px rgba(255, 255, 255, .04), 0 18px 40px -18px rgba(0, 0, 0, .9);
  --t1: rgba(248, 246, 240, .96); --t2: rgba(248, 246, 240, .68); --t3: rgba(248, 246, 240, .5);
  --chip: rgba(255, 255, 255, .06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .va {
    --sea: #071523; --sea-2: #04101b; --contour: rgba(116, 214, 255, .045);
    --card: #0b0c0e; --card-line: rgba(255, 255, 255, .07);
    --card-shadow: 0 0 0 1px rgba(255, 255, 255, .04), 0 18px 40px -18px rgba(0, 0, 0, .9);
    --t1: rgba(248, 246, 240, .96); --t2: rgba(248, 246, 240, .68); --t3: rgba(248, 246, 240, .5);
    --chip: rgba(255, 255, 255, .06);
  }
}
:root[data-theme="dark"] .va { background: radial-gradient(900px 520px at 50% -120px, rgba(116, 214, 255, .16), transparent 70%), repeating-radial-gradient(circle at 18% 42%, transparent 0 46px, var(--contour) 47px 48px), repeating-radial-gradient(circle at 86% 78%, transparent 0 58px, var(--contour) 59px 60px), linear-gradient(180deg, var(--sea), var(--sea-2)); background-attachment: fixed; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .va { background: radial-gradient(900px 520px at 50% -120px, rgba(116, 214, 255, .16), transparent 70%), repeating-radial-gradient(circle at 18% 42%, transparent 0 46px, var(--contour) 47px 48px), repeating-radial-gradient(circle at 86% 78%, transparent 0 58px, var(--contour) 59px 60px), linear-gradient(180deg, var(--sea), var(--sea-2)); background-attachment: fixed; } }

.a-in { max-width: 1180px; margin: 0 auto; padding: 36px 16px 64px; }
.a-hero { display: flex; justify-content: center; }
.a-island { width: min(680px, 100%); background: var(--isl); color: var(--isl-t1); border-radius: 34px; padding: 16px 18px 18px; box-shadow: 0 30px 60px -28px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .05) inset; }
.a-bar { display: flex; align-items: center; gap: 10px; padding: 2px 6px 12px; }
.a-bar b { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.a-bar .meta { margin-left: auto; color: var(--isl-t3); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.a-asks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.a-asks li { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; padding: 11px 12px; border-radius: 18px; background: var(--isl-row); }
.a-asks .k { font-size: 11px; color: #0c0d10; background: var(--wait); border-radius: 999px; padding: 1px 8px; font-weight: 600; margin-top: 2px; white-space: nowrap; }
.a-asks .k.pr { background: #ef6b74; }
.a-asks .k.test { background: rgba(248, 246, 240, .2); color: var(--isl-t1); }
.a-asks b { font-weight: 600; display: block; overflow-wrap: anywhere; }
.a-asks p { margin: 2px 0 0; color: var(--isl-t2); font-size: 13px; overflow-wrap: anywhere; }
.a-asks .from { color: var(--isl-t3); font-size: 12px; }

.a-buoys { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 28px auto 0; max-width: 860px; }
.a-buoy { background: var(--card); border: 1px solid var(--card-line); box-shadow: var(--card-shadow); border-radius: 24px; padding: 14px 16px 12px; min-width: 0; }
.a-buoy .n { font-size: 40px; line-height: 1; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px; }
.a-buoy .n .lamp { width: 10px; height: 10px; }
.a-buoy .l { color: var(--t2); font-size: 12px; margin-top: 6px; }
.a-buoy.wait .n { color: var(--wait); }
.a-sub { text-align: center; color: var(--t2); font-size: 12px; margin-top: 12px; }
.a-sub span + span::before { content: "·"; margin: 0 8px; color: var(--t3); }

.a-h { display: flex; align-items: baseline; gap: 10px; font-size: 13px; font-weight: 600; color: var(--t2); letter-spacing: .08em; margin: 44px 4px 14px; }
.a-h small { font-weight: 400; letter-spacing: 0; color: var(--t3); }
.a-isles { columns: 3 320px; column-gap: 16px; }
.a-isle { break-inside: avoid; margin: 0 0 16px; background: var(--card); border: 1px solid var(--card-line); box-shadow: var(--card-shadow); border-radius: 28px; padding: 16px 14px 12px; position: relative; }
.a-isle::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; pointer-events: none; box-shadow: 0 0 0 1.5px var(--ring, transparent); }
.a-isle.s-waiting { --ring: color-mix(in srgb, var(--wait) 70%, transparent); }
.a-isle.s-running { --ring: color-mix(in srgb, var(--run) 45%, transparent); }
.a-isle > header { display: flex; align-items: center; gap: 8px; padding: 0 4px 10px; }
.a-isle h3 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.a-isle .cnt { margin-left: auto; font-size: 12px; color: var(--t3); white-space: nowrap; }
.a-lead { border-top: 1px dashed var(--card-line); padding: 10px 4px 6px; }
.a-lead-h { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--t2); font-weight: 600; margin-bottom: 6px; min-width: 0; }
.a-lead-h span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.a-lead-ask { margin: 0 0 6px 16px; font-size: 12px; color: var(--wait); }
.a-tasks { list-style: none; margin: 0; padding: 0 0 0 4px; display: grid; gap: 4px; }
.a-task { display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 12px; background: var(--chip); min-width: 0; transition: background-color var(--fast) var(--ease); }
.a-task:hover { background: color-mix(in srgb, var(--chip) 100%, var(--t1) 6%); }
.a-task code { font-size: 12px; color: var(--t2); }
.a-task .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.a-task .x { font-size: 11px; color: var(--t3); white-space: nowrap; }
.a-task.s-waiting { background: color-mix(in srgb, var(--wait) 16%, transparent); }
.a-task .note { grid-column: 3 / -1; font-size: 12px; color: var(--t3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: -3px; }
.a-task.s-waiting .note { color: var(--wait); }
.a-calm { color: var(--t3); font-size: 12px; margin: 2px 4px 0; }

.a-lower { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
.a-panel { background: var(--card); border: 1px solid var(--card-line); box-shadow: var(--card-shadow); border-radius: 28px; padding: 18px 18px 14px; min-width: 0; }
.a-route { list-style: none; margin: 0; padding: 0; position: relative; }
.a-route::before { content: ""; position: absolute; left: 47px; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(var(--done), color-mix(in srgb, var(--done) 15%, transparent)); border-radius: 2px; }
.a-route li { display: grid; grid-template-columns: 38px 18px 1fr; gap: 6px; align-items: baseline; padding: 4px 0; }
.a-route time { font-size: 12px; color: var(--t3); font-variant-numeric: tabular-nums; text-align: right; }
.a-route i { width: 10px; height: 10px; border-radius: 50%; background: var(--card); box-shadow: inset 0 0 0 2px var(--done); justify-self: center; transform: translateY(1px); }
.a-route .t { min-width: 0; overflow-wrap: anywhere; }
.a-route .t code { color: var(--done); font-size: 12px; margin-right: 6px; }
.a-route .more { color: var(--t3); font-size: 12px; padding-left: 62px; }
.a-port dl { margin: 0; display: grid; gap: 14px; }
.a-port dt { font-size: 12px; color: var(--t3); margin-bottom: 4px; }
.a-port dd { margin: 0; display: grid; gap: 4px; }
.a-port .row { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.a-port .row code { color: var(--t2); font-size: 12px; flex: none; }
.a-port .row span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.a-port .tag { font-size: 11px; border-radius: 999px; padding: 0 7px; background: var(--chip); color: var(--t2); flex: none; }
.a-port .tag.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.a-port .tag.ok { background: color-mix(in srgb, var(--done) 18%, transparent); color: var(--done); }

@media (max-width: 760px) {
  .a-buoys { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .a-lower { grid-template-columns: minmax(0, 1fr); }
  .a-bar b { font-size: 19px; }
  .a-buoy .n { font-size: 34px; }
}

/* ============ B 塔台 ============ */
.vb {
  --paper: #f3f0e8;
  --ink: #111111;
  --ink-2: #55524b;
  --ink-3: #8c877c;
  --rule: #111111;
  --soft: rgba(17, 17, 17, .08);
  --hold: #ffd23f;
  --hold-ink: #111111;
  --flap: #121212;
  --flap-ink: #ffcf4a;
  --b-run: #2c63ff;
  --b-land: #0f9d58;
  background: var(--paper);
  color: var(--ink);
}
:root[data-theme="dark"] .vb { --paper: #0d0d0c; --ink: #f3f0e8; --ink-2: #b9b4a8; --ink-3: #7e7a70; --rule: #f3f0e8; --soft: rgba(243, 240, 232, .1); --flap: #1c1c1b; --b-run: #6f94ff; --b-land: #3ccf85; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .vb { --paper: #0d0d0c; --ink: #f3f0e8; --ink-2: #b9b4a8; --ink-3: #7e7a70; --rule: #f3f0e8; --soft: rgba(243, 240, 232, .1); --flap: #1c1c1b; --b-run: #6f94ff; --b-land: #3ccf85; } }
.b-in { max-width: 1240px; margin: 0 auto; padding: 28px 16px 64px; }
.b-top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 24px; border-bottom: 4px solid var(--rule); padding-bottom: 12px; }
.b-brand { font-size: clamp(34px, 7vw, 76px); font-weight: 700; line-height: .9; letter-spacing: -.04em; }
.b-brand small { display: block; font-size: 12px; letter-spacing: .3em; font-weight: 600; color: var(--ink-3); margin-bottom: 8px; }
.b-clock { margin-left: auto; text-align: right; font-variant-numeric: tabular-nums; }
.b-clock b { display: block; font-size: clamp(34px, 7vw, 76px); line-height: .9; font-weight: 700; letter-spacing: -.04em; }
.b-clock span { font-size: 12px; color: var(--ink-3); letter-spacing: .12em; }

.b-hold { margin-top: 20px; background: var(--hold); color: var(--hold-ink); display: grid; grid-template-columns: auto 1fr; gap: 0 28px; padding: 22px 24px; position: relative; overflow: hidden; }
.b-hold::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, transparent 0 18px, rgba(0, 0, 0, .06) 18px 36px); pointer-events: none; }
.b-hold-n { font-size: clamp(88px, 16vw, 168px); line-height: .82; font-weight: 700; letter-spacing: -.06em; font-variant-numeric: tabular-nums; }
.b-hold-l { font-size: 13px; font-weight: 700; letter-spacing: .28em; margin-top: 10px; }
.b-hold ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; align-self: center; position: relative; z-index: 1; }
.b-hold li { display: grid; grid-template-columns: 44px 1fr; gap: 12px; padding: 10px 0; border-top: 2px solid rgba(0, 0, 0, .85); }
.b-hold li:first-child { border-top: 0; }
.b-hold li > span { font-family: var(--mono); font-size: 22px; font-weight: 700; line-height: 1.1; }
.b-hold li b { display: block; font-size: 17px; line-height: 1.3; overflow-wrap: anywhere; }
.b-hold li p { margin: 2px 0 0; font-size: 13px; opacity: .78; overflow-wrap: anywhere; }
.b-hold li .k { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .14em; border: 1.5px solid currentColor; padding: 0 6px; margin-right: 8px; vertical-align: 2px; }

.b-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 2px solid var(--rule); }
.b-metric { padding: 18px 16px 14px 0; border-right: 2px solid var(--rule); min-width: 0; }
.b-metric + .b-metric { padding-left: 16px; }
.b-metric:last-child { border-right: 0; }
.b-metric .code { font-family: var(--mono); font-size: 11px; letter-spacing: .2em; color: var(--ink-3); }
.b-metric .n { font-size: clamp(48px, 8vw, 96px); font-weight: 700; line-height: .95; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
.b-metric .l { font-size: 13px; color: var(--ink-2); }
.b-metric.run .n { color: var(--b-run); }
.b-metric.land .n { color: var(--b-land); }
.b-foot { display: flex; flex-wrap: wrap; gap: 4px 20px; font-family: var(--mono); font-size: 12px; color: var(--ink-2); padding: 10px 0 0; }

.b-sec { margin-top: 44px; }
.b-sec > h2 { display: flex; align-items: baseline; gap: 12px; margin: 0 0 10px; font-size: 13px; letter-spacing: .3em; font-weight: 700; }
.b-sec > h2 small { letter-spacing: .05em; font-weight: 400; color: var(--ink-3); }
.b-lane { display: grid; grid-template-columns: 132px minmax(0, 1fr); border-top: 2px solid var(--rule); }
.b-lane:last-child { border-bottom: 2px solid var(--rule); }
.b-lane-h { padding: 12px 12px 12px 0; border-right: 1px solid var(--soft); }
.b-lane-h b { display: block; font-size: 18px; line-height: 1.15; letter-spacing: -.01em; }
.b-lane-h span { font-size: 11px; color: var(--ink-3); letter-spacing: .1em; font-family: var(--mono); }
.b-rows { min-width: 0; }
.b-row { display: grid; grid-template-columns: 136px minmax(0, 1fr) minmax(0, 170px) 112px; gap: 12px; align-items: center; padding: 9px 0 9px 14px; border-bottom: 1px solid var(--soft); transition: background-color var(--fast) var(--ease); }
.b-row:last-child { border-bottom: 0; }
.b-row:hover { background: var(--soft); }
.b-flap { display: inline-flex; gap: 2px; }
.b-flap i { font-style: normal; font-family: var(--mono); font-weight: 700; font-size: 14px; width: 14px; height: 24px; line-height: 24px; text-align: center; background: var(--flap); color: var(--flap-ink); border-radius: 2px; position: relative; }
.b-flap i::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0, 0, 0, .55); }
.b-flap.lead i { color: #e8e4da; }
.b-row .what { min-width: 0; }
.b-row .what b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.b-row .what p { margin: 0; font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.b-row .gate { font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.b-st { justify-self: end; font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .12em; padding: 3px 8px; border: 1.5px solid currentColor; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.b-st.s-running { color: var(--b-run); }
.b-st.s-background { color: var(--b-run); border-style: dashed; }
.b-st.s-waiting { background: var(--hold); color: #111; border-color: #111; }
.b-st.s-done { color: var(--b-land); }
.b-st.s-idle { color: var(--ink-3); }
.b-st .lamp { width: 6px; height: 6px; }
.b-st.s-waiting .lamp { background: #111; box-shadow: none; }

.b-runway { position: relative; height: 120px; border-bottom: 2px solid var(--rule); margin-top: 8px; }
.b-runway .hr { position: absolute; bottom: -22px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); transform: translateX(-50%); }

<script>
(() => {
  const D = JSON.parse(document.getElementById("data").textContent);
  const P = D.progress;
  const tz = D.tz || undefined;
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const hm = new Intl.DateTimeFormat("zh-CN", { timeZone: tz, hour: "2-digit", minute: "2-digit", hour12: false });
  const ymd = new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit" });
  const hourOf = new Intl.DateTimeFormat("en-GB", { timeZone: tz, hour: "2-digit", minute: "2-digit", hour12: false });
  const wk = new Intl.DateTimeFormat("zh-CN", { timeZone: tz, weekday: "short" });
  const now = new Date(P.generatedAt);
  const today = ymd.format(now);
  const STATUS = { running: "在跑", background: "后台跑", waiting: "等你", done: "做完", idle: "闲着" };
  const ORDER = { waiting: 0, running: 1, background: 2, done: 3, idle: 4 };
  const BOARD = { running: "在跑 RUN", background: "后台 TAXI", waiting: "等你 HOLD", done: "做完 LANDED", idle: "闲着 PARKED" };

  const parse = (s) => {
    const t = s.title;
    let m = t.match(/^\[([A-Z]\d+(?:\.\d+)*)\]\s*(.*)$/);
    if (m) return { ...s, id: m[1], short: m[2] };
    m = t.match(/^(?:Fuyu-)?\[(?:任务|总控|长期任务)\]\s*(.*)$/);
    return { ...s, id: null, short: m ? m[1] : t };
  };
  const sessions = D.sessions.map(parse);
  const byTitle = new Map(sessions.map((s) => [s.title, s]));
  const taskInfo = new Map(P.inProgress.map((t) => [t.id, t]));
  const controllers = sessions.filter((s) => s.kind === "controller");
  const leadsOf = (c) => sessions.filter((s) => s.kind === "lead" && s.parent === c.title);
  const tasksOf = (l) => sessions.filter((s) => s.kind === "task" && s.parent === l.title).sort((a, b) => ORDER[a.status] - ORDER[b.status]);
  const familyOf = (c) => [c, ...leadsOf(c).flatMap((l) => [l, ...tasksOf(l)])];
  const agg = (list) => list.some((s) => s.status === "waiting") ? "waiting" : list.some((s) => s.status === "running" || s.status === "background") ? "running" : "idle";
  const lanes = controllers.map((c) => ({ c, leads: leadsOf(c), fam: familyOf(c) })).filter((l) => l.fam.length > 1 || l.c.status !== "idle");
  lanes.sort((a, b) => ORDER[agg(a.fam)] - ORDER[agg(b.fam)] || b.fam.length - a.fam.length);
  const calm = controllers.filter((c) => !lanes.some((l) => l.c === c)).map((c) => c.short);
  const upLead = (s) => s.kind === "task" ? byTitle.get(s.parent) : null;
  const upCtl = (s) => { let x = s; while (x && x.kind !== "controller") x = byTitle.get(x.parent); return x; };
  const label = (s) => s.id ? s.id + " " + s.short : s.short;

  const asks = [];
  for (const s of sessions.filter((x) => x.status === "waiting")) {
    const from = [upLead(s)?.short, upCtl(s)?.short].filter(Boolean).join(" · ");
    asks.push({ kind: "会话", cls: "", title: label(s), detail: s.ask || "等你回复", from });
  }
  for (const pr of P.prs.list.filter((p) => p.state.some((x) => x.includes("没过")))) {
    asks.push({ kind: "PR", cls: "pr", title: "#" + pr.number + " " + pr.title, detail: pr.state.join("、"), from: pr.author });
  }
  for (const it of P.issues.list) asks.push({ kind: "issue", cls: "pr", title: "#" + it.issue + " " + (it.title || it.id), detail: "任务已完成，issue 还开着", from: it.id });
  const waitCount = asks.length;
  const tests = P.forUser || [];
  const testItem = tests.length ? { kind: "实测", cls: "test", title: tests.length + " 项等你实测", detail: tests.slice(0, 4).map((t) => t.id).join("、") + (tests.length > 4 ? " 等" : ""), from: "" } : null;

  const running = sessions.filter((s) => s.status === "running" || s.status === "background");
  const merged = D.mergedPrs.filter((p) => ymd.format(new Date(p.mergedAt)) === today).sort((a, b) => b.mergedAt.localeCompare(a.mergedAt));
  const closed = D.closedIssues.filter((p) => ymd.format(new Date(p.closedAt)) === today);
  const linked = new Set(sessions.map((s) => s.id).filter(Boolean));
  const orphans = P.inProgress.filter((t) => !linked.has(t.id) && !t.children);
  const unpushed = P.commits.unpushed.length;
  const cap = (list, src) => list.length && list.length === src.length ? list.length + "+" : String(list.length);
  const mergedN = cap(merged, D.mergedPrs), closedN = cap(closed, D.closedIssues);
  const stampText = "数据取于 " + hm.format(now) + " · " + today;
  document.getElementById("stamp").textContent = stampText;

  const dirtyTag = (s) => { const t = s.id && taskInfo.get(s.id); return t && t.dirty ? t.dirty + " 个文件没提交" : ""; };

  const A = () => {
    const askRows = [...asks, ...(testItem ? [testItem] : [])].map((a) => `<li><span class="k ${a.cls}">${esc(a.kind)}</span><div><b>${esc(a.title)}</b><p>${esc(a.detail)}${a.from ? ` <span class="from">· ${esc(a.from)}</span>` : ""}</p></div></li>`).join("");
    const task = (s) => `<li class="a-task s-${s.status}" title="${esc(STATUS[s.status])}"><span class="lamp"></span><code>${esc(s.id || "")}</code><span class="t">${esc(s.short)}</span><span class="x">${esc(dirtyTag(s) || STATUS[s.status])}</span>${s.ask || s.note ? `<span class="note">${esc(s.ask || s.note)}</span>` : ""}</li>`;
    const isles = lanes.map(({ c, leads, fam }) => {
      const st = agg(fam);
      const leadHtml = leads.map((l) => `<div class="a-lead"><div class="a-lead-h"><span class="lamp ${l.status}"></span><span>${esc(l.short)}</span></div>${l.ask ? `<p class="a-lead-ask">${esc(l.ask)}</p>` : ""}${tasksOf(l).length ? `<ul class="a-tasks">${tasksOf(l).map(task).join("")}</ul>` : ""}</div>`).join("");
      const own = c.status !== "idle" ? `<div class="a-lead"><ul class="a-tasks">${task({ ...c, short: c.note || "总控自己在跑" })}</ul></div>` : "";
      return `<article class="a-isle s-${st}"><header><span class="lamp ${st}"></span><h3>${esc(c.short)}</h3><span class="cnt">${fam.length - 1 ? fam.length - 1 + " 个会话" : "总控"}</span></header>${own}${leadHtml}</article>`;
    }).join("");
    const route = merged.slice(0, 14).map((p) => `<li><time>${esc(hm.format(new Date(p.mergedAt)))}</time><i></i><span class="t"><code>#${p.number}</code>${esc(p.title)}</span></li>`).join("");
    const prs = P.prs.list.map((p) => { const bad = p.state.some((x) => x.includes("没过")); return `<div class="row"><code>#${p.number}</code><span>${esc(p.title)}</span><em class="tag ${bad ? "bad" : "ok"}">${bad ? "检查没过" : "可以合入"}</em></div>`; }).join("");
    const orph = orphans.map((t) => `<div class="row"><code>${esc(t.id)}</code><span>${esc(t.title)}</span><em class="tag">${esc(t.stale ? "很久没动" : t.owner ? t.host : "没人负责")}</em></div>`).join("");
    document.getElementById("v-a").innerHTML = `<div class="a-in">
      <header class="a-hero"><div class="a-island"><div class="a-bar"><span class="lamp ${waitCount ? "waiting" : "done"}"></span><b>${waitCount ? waitCount + " 件事在等你" : "没有事在等你"}</b><span class="meta">${esc(hm.format(now))} · ${esc(wk.format(now))}</span></div><ol class="a-asks">${askRows}</ol></div></header>
      <div class="a-buoys">
        <div class="a-buoy"><div class="n"><span class="lamp running"></span>${running.length}</div><div class="l">在跑的会话</div></div>
        <div class="a-buoy wait"><div class="n">${waitCount}</div><div class="l">等你处理</div></div>
        <div class="a-buoy"><div class="n">${mergedN}</div><div class="l">今天合入的 PR</div></div>
        <div class="a-buoy"><div class="n">${P.inProgress.length}</div><div class="l">进行中的任务</div></div>
      </div>
      <p class="a-sub"><span>${P.dirty.total} 个文件没提交</span><span>${unpushed} 个提交没推</span><span>${P.prs.list.length} 个 PR 开着</span><span>今天关了 ${closedN} 个 issue</span></p>
      <h2 class="a-h">群岛 <small>每座岛是一个总控，岛上是组长和它派出的任务会话</small></h2>
      <div class="a-isles">${isles}</div>
      ${calm.length ? `<p class="a-calm">风平浪静：${esc(calm.join(" · "))}</p>` : ""}
      <div class="a-lower">
        <section><h2 class="a-h">今日航线 <small>合入 main 的 PR</small></h2><div class="a-panel"><ol class="a-route">${route}${merged.length > 14 ? `<li class="more">还有 ${merged.length - 14} 个更早的</li>` : ""}</ol></div></section>
        <section><h2 class="a-h">港口 <small>PR 和没人管的任务</small></h2><div class="a-panel a-port"><dl><div><dt>开着的 PR</dt><dd>${prs || "<span>没有</span>"}</dd></div><div><dt>没有会话在做的进行中任务</dt><dd>${orph || "<span>没有</span>"}</dd></div></dl></div></section>
      </div></div>`;
  };

  const flap = (id, lead) => `<span class="b-flap${lead ? " lead" : ""}">${[...String(id).padEnd(4, " ")].map((c) => `<i>${c === " " ? "&nbsp;" : esc(c)}</i>`).join("")}</span>`;
  const B = () => {
    const holds = [...asks, ...(testItem ? [testItem] : [])].map((a, i) => `<li><span>${String(i + 1).padStart(2, "0")}</span><div><b><span class="k">${esc(a.kind)}</span>${esc(a.title)}</b><p>${esc(a.detail)}${a.from ? " · " + esc(a.from) : ""}</p></div></li>`).join("");
    const row = (s, lead) => `<div class="b-row">${flap(s.id || (lead ? "LEAD" : "CTRL"), !s.id)}<div class="what"><b>${esc(s.short)}</b><p>${esc(s.ask || s.note || dirtyTag(s) || (s.kind === "lead" ? "组长 · 派出 " + tasksOf(s).length + " 个任务会话" : s.kind === "controller" ? "总控" : ""))}</p></div><span class="gate">${esc(upLead(s)?.short || (s.kind === "lead" ? "组长" : "总控"))}</span><span class="b-st s-${s.status}"><span class="lamp"></span>${esc(BOARD[s.status])}</span></div>`;
    const lanesHtml = lanes.map(({ c, leads, fam }) => {
      const rows = [...(c.status !== "idle" ? [c] : []), ...leads.flatMap((l) => [l, ...tasksOf(l)])].sort((a, b) => ORDER[a.status] - ORDER[b.status]);
      return `<div class="b-lane"><div class="b-lane-h"><b>${esc(c.short)}</b><span>${fam.length - 1 ? fam.length - 1 + " SESSIONS" : "LONG-RUN"}</span></div><div class="b-rows">${rows.map((s) => row(s, s.kind === "lead")).join("")}</div></div>`;
    }).join("");
    const first = merged.length ? new Date(merged[merged.length - 1].mergedAt) : now;
    const h0 = Math.max(0, Number(hourOf.format(first).slice(0, 2)) - 1);
    const h1 = Math.min(24, Number(hourOf.format(now).slice(0, 2)) + 1);
    const pos = (d) => { const [h, m] = hourOf.format(d).split(":").map(Number); return ((h + m / 60 - h0) / (h1 - h0)) * 100; };
    const hrs = []; for (let h = h0; h <= h1; h += (h1 - h0 > 12 ? 2 : 1)) hrs.push(`<span class="hr" style="left:${((h - h0) / (h1 - h0)) * 100}%">${String(h).padStart(2, "0")}</span>`);
    const ticks = merged.map((p, i) => `<span class="tick" title="#${p.number} ${esc(p.title)}" style="left:${pos(new Date(p.mergedAt))}%;height:${30 + ((p.number * 37) % 70)}%"></span>`).join("");
    const log = merged.map((p) => `<li><time>${esc(hm.format(new Date(p.mergedAt)))}</time><code>#${p.number}</code><span>${esc(p.title)}</span></li>`).join("");
    const prs = P.prs.list.map((p) => { const bad = p.state.some((x) => x.includes("没过")); return `<div class="r"><code>#${p.number}</code><span>${esc(p.title)}</span><em class="${bad ? "bad" : ""}">${bad ? "FAIL" : "READY"}</em></div>`; }).join("");
    const orph = orphans.map((t) => `<div class="r"><code>${esc(t.id)}</code><span>${esc(t.title)}</span><em>${esc(t.stale ? "STALE" : t.owner ? "ELSEWHERE" : "NOBODY")}</em></div>`).join("");
    const commits = P.commits.unpushed.slice(-5).reverse().map((c) => `<div class="r"><span>${esc(c.subject)}</span></div>`).join("");
    document.getElementById("v-b").innerHTML = `<div class="b-in">
      <header class="b-top"><div class="b-brand"><small>FUYU · CONTROL TOWER</small>塔台</div><div class="b-clock"><b>${esc(hm.format(now))}</b><span>${esc(today)} ${esc(wk.format(now))}</span></div></header>
      <section class="b-hold"><div><div class="b-hold-n">${String(waitCount).padStart(2, "0")}</div><div class="b-hold-l">等你处理 · HOLD</div></div><ol>${holds}</ol></section>
      <section class="b-metrics">
        <div class="b-metric run"><div class="code">RUN</div><div class="n">${running.length}</div><div class="l">在跑的会话</div></div>
        <div class="b-metric land"><div class="code">LANDED</div><div class="n">${mergedN}</div><div class="l">今天合入的 PR</div></div>
        <div class="b-metric"><div class="code">ACTIVE</div><div class="n">${P.inProgress.length}</div><div class="l">进行中的任务</div></div>
        <div class="b-metric"><div class="code">DIRTY</div><div class="n">${P.dirty.total}</div><div class="l">没提交的文件</div></div>
      </section>
      <div class="b-foot"><span>UNPUSHED ${unpushed}</span><span>AHEAD ${P.commits.ahead}</span><span>BEHIND ${P.commits.behind}</span><span>OPEN PR ${P.prs.list.length}</span><span>ISSUES CLOSED TODAY ${closedN}</span></div>
      <section class="b-sec"><h2>航班 <small>按总控分泳道，组长和任务会话按状态排</small></h2>${lanesHtml}${calm.length ? `<div class="b-foot">安静：${esc(calm.join(" / "))}</div>` : ""}</section>
      <section class="b-sec"><h2>跑道 <small>今天每一次合入</small></h2><div class="b-runway">${hrs.join("")}${ticks}<span class="now" style="left:${pos(now)}%"></span></div><ol class="b-log">${log}</ol></section>
      <section class="b-sec"><h2>停机坪</h2><div class="b-misc"><div><h3>OPEN PR</h3>${prs || "—"}</div><div><h3>NO SESSION</h3>${orph || "—"}</div><div><h3>UNPUSHED · 最近 5 个</h3>${commits || "—"}</div></div></section>
    </div>`;
  };

  const C = () => {
    const R = { waiting: 125, running: 245, background: 245, done: 365, idle: 365 };
    const n = lanes.length;
    const W = (Math.PI * 2) / n;
    const pt = (r, a) => [Math.cos(a - Math.PI / 2) * r, Math.sin(a - Math.PI / 2) * r];
    let svg = "";
    lanes.forEach(({ c }, i) => {
      if (i % 2 === 0) {
        const [x1, y1] = pt(430, i * W), [x2, y2] = pt(430, (i + 1) * W);
        svg += `<path class="sector" d="M0 0 L${x1.toFixed(1)} ${y1.toFixed(1)} A430 430 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z"/>`;
      }
      const [sx, sy] = pt(430, i * W);
      svg += `<line class="spoke" x1="0" y1="0" x2="${sx.toFixed(1)}" y2="${sy.toFixed(1)}"/>`;
    });
    svg += [125, 245, 365, 430].map((r, i) => `<circle class="ring${i === 0 ? " inner" : ""}" r="${r}"/>`).join("");
    svg += `<text class="ring-l" x="0" y="${-125 + 6}" text-anchor="middle">等你</text><text class="ring-l" x="0" y="${-245 + 6}" text-anchor="middle">在跑</text><text class="ring-l" x="0" y="${-365 + 6}" text-anchor="middle">闲着 · 做完</text>`;
    const dots = [];
    lanes.forEach(({ c, fam }, i) => {
      const members = fam.filter((s) => s.kind !== "controller" || s.status !== "idle");
      const rings = {};
      for (const s of members) { const r = R[s.status]; (rings[r] ||= []).push(s); }
      for (const [r, list] of Object.entries(rings)) {
        list.forEach((s, k) => {
          const a = i * W + ((k + 1) / (list.length + 1)) * W;
          const [x, y] = pt(Number(r) + (list.length > 2 ? (k % 2 ? 24 : -24) : 0), a);
          dots.push({ s, x, y, a });
        });
      }
      const [lx, ly] = pt(468, i * W + W / 2);
      const anchor = Math.abs(lx) < 40 ? "middle" : lx > 0 ? "start" : "end";
      svg += `<text class="sec-l" x="${lx.toFixed(1)}" y="${(ly + 6).toFixed(1)}" text-anchor="${anchor}">${esc(c.short)}</text><text class="sec-n" x="${lx.toFixed(1)}" y="${(ly + 26).toFixed(1)}" text-anchor="${anchor}">${fam.length - 1 ? fam.length - 1 + " 个会话" : "总控"}</text>`;
    });
    for (const { s, x, y } of dots) {
      const lead = s.kind !== "task";
      const r = lead ? 7 : 11;
      if (s.status === "waiting") svg += `<circle class="c-halo" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="24"/>`;
      svg += `<circle class="dot ${s.status}${lead ? " lead" : ""}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}"><title>${esc(s.title + " · " + STATUS[s.status])}</title></circle>`;
      const right = x >= 0;
      if (lead && s.status !== "waiting") continue;
      svg += `<text class="lbl${lead ? " lead" : ""}${s.status === "waiting" ? " waiting" : ""}" x="${(x + (right ? 15 : -15)).toFixed(1)}" y="${(y + 5).toFixed(1)}" text-anchor="${right ? "start" : "end"}">${esc(s.id || s.short)}</text>`;
    }
    svg += `<rect class="core" x="-80" y="-46" width="160" height="92" rx="46"/><text class="core-t" x="0" y="10" text-anchor="middle">${waitCount}</text><text class="core-s" x="0" y="33" text-anchor="middle">等 你</text>`;
    const hours = []; const h1 = Number(hourOf.format(now).slice(0, 2));
    for (let h = 0; h <= h1; h++) hours.push(merged.filter((p) => Number(hourOf.format(new Date(p.mergedAt)).slice(0, 2)) === h).length);
    const max = Math.max(1, ...hours);
    const bars = hours.map((v, h) => `<i class="${v ? "" : "zero"}" style="height:${(v / max) * 100}%" title="${h} 点 · ${v} 个"></i>`).join("");
    const near = [...asks, ...(testItem ? [testItem] : [])].map((a) => `<li><span class="lamp ${a.kind === "实测" ? "" : "waiting"}"></span><div><b>${esc(a.title)}</b><p>${esc(a.detail)}${a.from ? " · " + esc(a.from) : ""}</p></div></li>`).join("");
    const last = merged.slice(0, 5).map((p) => `<li><code>#${p.number}</code><span>${esc(p.title)}</span></li>`).join("");
    document.getElementById("v-c").innerHTML = `<div class="c-in">
      <div class="c-stage"><div class="c-head"><h2>雷达</h2><p>扇区是总控，离中心越近越需要你。</p></div>
        <svg class="c-svg" viewBox="-600 -505 1200 1010" role="img" aria-label="会话雷达">${svg}</svg>
        <div class="c-legend"><span><span class="lamp waiting"></span>等你</span><span><span class="lamp running"></span>在跑</span><span><span class="lamp background"></span>后台跑</span><span><span class="lamp done"></span>做完</span><span><span class="lamp"></span>闲着</span><span>实心大点是任务会话，空心小点是组长（悬停看名字）</span></div>
      </div>
      <aside class="c-side">
        <div class="c-card"><h3>近处 · 等你处理</h3><ul class="c-near">${near}</ul></div>
        <div class="c-card"><div class="c-stats"><div><b>${running.length}</b><span>在跑</span></div><div><b>${mergedN}</b><span>今天合入</span></div><div><b>${P.inProgress.length}</b><span>进行中任务</span></div></div></div>
        <div class="c-card"><h3>今天每小时合入</h3><div class="c-bars">${bars}</div><div class="c-axis"><span>0 点</span><span>${h1} 点</span></div><ul class="c-last">${last}</ul></div>
        <div class="c-card"><h3>其他</h3><div class="c-legend"><span>${P.dirty.total} 个文件没提交</span><span>${unpushed} 个提交没推</span><span>${P.prs.list.length} 个 PR 开着</span>${calm.length ? `<span>安静：${esc(calm.join("、"))}</span>` : ""}</div></div>
      </aside></div>`;
  };

  A(); B(); C();
  const show = (v) => {
    document.querySelectorAll(".view").forEach((el) => el.classList.toggle("on", el.id === "v-" + v));
    document.querySelectorAll("#views button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
    history.replaceState(null, "", "#" + v);
  };
  document.getElementById("views").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) show(b.dataset.v); });
  document.getElementById("themes").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.t) document.documentElement.dataset.theme = b.dataset.t; else delete document.documentElement.dataset.theme;
    document.querySelectorAll("#themes button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  });
  const initial = location.hash.slice(1);
  if (["a", "b", "c"].includes(initial)) show(initial);
})();
</script>
</body>
</html>
