<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>浮屿 Fuyu · 安装引导页 + 岛屿面板自动化演示交互预览 v2</title>
<style>
  :root {
    color-scheme: dark;
    --font-ui: "Segoe UI Variable Text", "Segoe UI", -apple-system, "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
    --motion-ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    --motion-ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --motion-fast: 120ms;
    --motion-base: 160ms;
    --motion-medium: 240ms;
    --motion-slow: 420ms;

    --accent: #74d6ff;
    --on-accent: #05202c;
    --card-bg: rgba(20, 22, 28, 0.92);
    --card-surface: rgba(255, 255, 255, 0.045);
    --card-surface-hover: rgba(255, 255, 255, 0.085);
    --card-border: rgba(255, 255, 255, 0.11);
    --card-border-soft: rgba(255, 255, 255, 0.07);
    --text: #f5f4ef;
    --text-muted: rgba(245, 244, 239, 0.68);
    --text-subtle: rgba(245, 244, 239, 0.48);
    --mint: #5ce1a6;
    --warn: #ffd166;
    --danger: #ff7a84;

    --island-bg: #111318;
    --island-text: #f6f6f2;
    --island-muted: rgba(246, 246, 242, 0.66);
    --island-border: rgba(255, 255, 255, 0.13);
    --island-blur: 0px;
    --island-motion-ms: 420ms;
    --island-motion-curve: cubic-bezier(0.34, 1.36, 0.5, 1);
  }

  .stage--light {
    --card-bg: rgba(246, 247, 250, 0.94);
    --card-surface: rgba(20, 24, 34, 0.045);
    --card-surface-hover: rgba(20, 24, 34, 0.08);
    --card-border: rgba(20, 24, 34, 0.12);
    --card-border-soft: rgba(20, 24, 34, 0.07);
    --text: #171920;
    --text-muted: rgba(23, 25, 32, 0.68);
    --text-subtle: rgba(23, 25, 32, 0.48);
    --mint: #1d8a5a;
    --warn: #b57614;
    --on-accent: #ffffff;
  }

  .reduced-motion *,
  .reduced-motion *::before,
  .reduced-motion *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 120ms !important;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0b0d12;
    color: var(--text);
    font: 13.5px/1.5 var(--font-ui);
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    overflow: hidden;
  }

  .dev-ribbon {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 7px 14px;
    background: #12141b;
    border-bottom: 1px solid rgba(255, 255, 255, 0.09);
    font-size: 12px;
    color: rgba(245, 244, 239, 0.78);
    flex-wrap: wrap;
    z-index: 60;
  }
  .dev-ribbon__left, .dev-ribbon__right {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
  }
  .dev-brand {
    font-weight: 700;
    color: #fff;
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .dev-badge {
    font-size: 10.5px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(116, 214, 255, 0.15);
    color: #74d6ff;
    border: 1px solid rgba(116, 214, 255, 0.3);
  }
  .dev-seg {
    display: inline-flex;
    padding: 2px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 8px;
    gap: 2px;
  }
  .dev-btn {
    border: 0;
    background: transparent;
    color: rgba(245, 244, 239, 0.72);
    font: inherit;
    font-size: 11.5px;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color var(--motion-fast) var(--motion-ease), color var(--motion-fast) var(--motion-ease);
  }
  .dev-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.07); }
  .dev-btn.active { background: rgba(116, 214, 255, 0.2); color: #9de4ff; font-weight: 600; }
  .dev-btn--outline {
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.04);
  }

  .desktop-stage {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(900px 520px at 18% 12%, rgba(74, 148, 224, 0.36), transparent 62%),
      radial-gradient(760px 480px at 82% 24%, rgba(154, 96, 224, 0.28), transparent 60%),
      radial-gradient(700px 460px at 54% 88%, rgba(42, 168, 154, 0.24), transparent 64%),
      linear-gradient(145deg, #121826 0%, #1c1930 52%, #11212b 100%);
    user-select: none;
  }
  .desktop-stage.wallpaper-day {
    background:
      radial-gradient(900px 520px at 18% 12%, rgba(145, 205, 255, 0.65), transparent 60%),
      radial-gradient(760px 480px at 82% 20%, rgba(212, 186, 255, 0.55), transparent 60%),
      radial-gradient(700px 460px at 55% 90%, rgba(164, 232, 220, 0.52), transparent 64%),
      linear-gradient(145deg, #d8e5f5 0%, #e8e1f5 52%, #d5ebe7 100%);
  }

  .director-hud {
    position: absolute;
    right: 18px;
    top: 14px;
    z-index: 45;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px 6px 12px;
    border-radius: 999px;
    background: rgba(16, 18, 24, 0.84);
    border: 1px solid rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(16px);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    font-size: 11.5px;
    color: #eef2fa;
  }
  .director-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--mint);
    flex: none;
    animation: dirPulse 1.6s var(--motion-ease) infinite;
  }
  .director-dot.paused {
    background: var(--warn);
    animation: none;
  }
  .director-dot.user {
    background: var(--accent);
    animation: none;
  }
  @keyframes dirPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  .director-caption {
    max-width: 240px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .director-hud__btn {
    height: 22px;
    padding: 0 8px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.06);
    color: #fff;
    font: inherit;
    font-size: 11px;
    cursor: pointer;
  }
  .director-hud__btn:hover { background: rgba(116, 214, 255, 0.22); border-color: rgba(116, 214, 255, 0.5); }

  .desktop-files {
    position: absolute;
    left: 24px;
    top: 74px;
    display: grid;
    gap: 14px;
    z-index: 14;
    transition: opacity var(--motion-medium) var(--motion-ease);
  }
  .desktop-file {
    width: 78px;
    display: grid;
    justify-items: center;
    gap: 5px;
    padding: 8px 6px;
    border-radius: 10px;
    color: rgba(255, 255, 255, 0.92);
    font-size: 11px;
    text-align: center;
    cursor: grab;
    background: rgba(10, 12, 18, 0.28);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(8px);
    transition: background-color var(--motion-fast) var(--motion-ease), border-color var(--motion-fast) var(--motion-ease);
  }
  .desktop-file:hover {
    background: rgba(116, 214, 255, 0.18);
    border-color: rgba(116, 214, 255, 0.5);
  }
  .desktop-file.pulse-hint {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 26%, transparent);
  }
  .desktop-file__icon {
    width: 34px;
    height: 38px;
    border-radius: 7px;
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 10px;
    color: #082032;
    background: linear-gradient(155deg, #9be4ff, #5bb7ff);
  }
  .desktop-file__icon--md {
    background: linear-gradient(155deg, #b8f5d6, #5fd49c);
  }

  .scrim {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    background: rgba(5, 7, 13, 0.5);
    transition: opacity var(--motion-medium) var(--motion-ease);
  }
  .scrim.mode-soft { opacity: 0.34; }
  .scrim.mode-off { opacity: 0; }

  .spotlight-ring {
    position: absolute;
    pointer-events: none;
    z-index: 25;
    border: 2px solid var(--accent);
    border-radius: 0 0 26px 26px;
    transition:
      left var(--motion-medium) var(--motion-ease),
      top var(--motion-medium) var(--motion-ease),
      width var(--motion-medium) var(--motion-ease),
      height var(--motion-medium) var(--motion-ease),
      border-radius var(--motion-medium) var(--motion-ease),
      opacity var(--motion-medium) var(--motion-ease);
  }
  .spotlight-ring.detached { border-radius: 26px; }
  .spotlight-ring.mode-off { opacity: 0; }
  .spotlight-ring.mode-calm { opacity: 0.45; }
  .spotlight-ring.mode-pulse { opacity: 0.92; }
  .spotlight-ring.mode-pulse::after {
    content: "";
    position: absolute;
    inset: -3px;
    border: 2px solid var(--accent);
    border-radius: inherit;
    animation: spotPulse 2s var(--motion-ease) infinite;
  }
  @keyframes spotPulse {
    from { opacity: 0.85; transform: scale(1); }
    to { opacity: 0; transform: scale(1.06, 1.24); }
  }

  .real-island {
    position: absolute;
    z-index: 30;
    background: var(--island-bg);
    color: var(--island-text);
    border: 1px solid var(--island-border);
    backdrop-filter: blur(var(--island-blur));
    box-shadow: 0 14px 38px rgba(0, 0, 0, 0.44);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition:
      left var(--island-motion-ms) var(--island-motion-curve),
      top var(--island-motion-ms) var(--island-motion-curve),
      width var(--island-motion-ms) var(--island-motion-curve),
      height var(--island-motion-ms) var(--island-motion-curve),
      border-radius var(--island-motion-ms) var(--island-motion-curve),
      background-color var(--motion-medium) var(--motion-ease),
      border-color var(--motion-medium) var(--motion-ease);
  }
  .real-island.edge-top { border-top: 0; border-radius: 0 0 22px 22px; }
  .real-island.form-pill { border: 1px solid var(--island-border); border-radius: 999px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5); }
  .real-island.form-pill.expanded { border-radius: 26px; }
  .real-island.form-notch {
    border-top: 0;
    border-radius: 0 0 20px 20px;
    background: #08090c;
    color: #f6f6f2;
    border-color: color-mix(in srgb, var(--accent) 42%, rgba(255, 255, 255, 0.12));
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55), 0 0 0 1px color-mix(in srgb, var(--accent) 26%, transparent);
  }
  .real-island.form-notch.expanded {
    background: var(--island-bg);
    color: var(--island-text);
    border-radius: 0 0 24px 24px;
  }
  .real-island.edge-bottom { border-bottom: 0; border-radius: 22px 22px 0 0; }
  .real-island.edge-left { border-left: 0; border-radius: 0 22px 22px 0; }
  .real-island.edge-right { border-right: 0; border-radius: 22px 0 0 22px; }
  .real-island.edge-taskbar {
    border-radius: 10px;
    box-shadow: none;
    border-color: rgba(255, 255, 255, 0.14);
  }
  .real-island.edge-taskbar.taskbar-transparent:not(.expanded) {
    background: rgba(255, 255, 255, 0.06);
    border-color: rgba(255, 255, 255, 0.12);
    color: #f6f6f2;
  }
  .real-island.edge-taskbar.expanded {
    border-radius: 20px;
    box-shadow: 0 16px 42px rgba(0, 0, 0, 0.5);
  }
  .notch-bar {
    height: 36px;
    padding: 0 12px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 156px minmax(0, 1fr);
    align-items: center;
    gap: 8px;
    cursor: pointer;
    flex: none;
  }
  .notch-wing {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
  }
  .notch-wing--right { justify-content: flex-end; }
  .notch-cutout {
    height: 26px;
    border-radius: 0 0 12px 12px;
    background: #000;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-top: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    align-self: start;
  }
  .notch-camera {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #2b4166, #090d16 70%);
    border: 1px solid rgba(116, 214, 255, 0.25);
  }
  .form-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 6px;
    margin-bottom: 12px;
  }
  .form-btn {
    padding: 7px 4px;
    border-radius: 10px;
    border: 1px solid var(--card-border-soft);
    background: var(--card-surface);
    color: var(--text-muted);
    font: inherit;
    font-size: 11px;
    cursor: pointer;
    display: grid;
    justify-items: center;
    gap: 5px;
    transition: border-color var(--motion-fast) var(--motion-ease), background-color var(--motion-fast) var(--motion-ease), color var(--motion-fast) var(--motion-ease);
  }
  .form-btn:hover { color: var(--text); border-color: var(--card-border); background: var(--card-surface-hover); }
  .form-btn.active {
    color: var(--text);
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 13%, var(--card-surface));
    box-shadow: inset 0 0 0 1px var(--accent);
    font-weight: 600;
  }
  .form-mini {
    width: 40px;
    height: 24px;
    border-radius: 5px;
    border: 1px solid var(--card-border);
    background: rgba(128, 134, 152, 0.08);
    position: relative;
    overflow: hidden;
  }
  .form-mini i { position: absolute; background: var(--accent); border-radius: 99px; }
  .form-mini--top i { top: 0; left: 10px; width: 18px; height: 4px; border-radius: 0 0 4px 4px; }
  .form-mini--pill i { top: 4px; left: 9px; width: 20px; height: 4px; }
  .form-mini--notch i { top: 0; left: 6px; width: 26px; height: 5px; border-radius: 0 0 4px 4px; background: color-mix(in srgb, var(--accent) 65%, #000); }
  .form-mini--notch b { position: absolute; top: 0; left: 14px; width: 10px; height: 5px; border-radius: 0 0 3px 3px; background: #000; }
  .form-mini--bottom i { bottom: 0; left: 10px; width: 18px; height: 4px; border-radius: 4px 4px 0 0; }
  .form-mini--left i { left: 0; top: 5px; width: 4px; height: 12px; border-radius: 0 4px 4px 0; }
  .form-mini--right i { right: 0; top: 5px; width: 4px; height: 12px; border-radius: 4px 0 0 4px; }
  .form-mini--taskbar b { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(128, 134, 152, 0.28); }
  .form-mini--taskbar i { bottom: 1px; left: 11px; width: 16px; height: 4px; border-radius: 3px; }
  .taskbar.has-island-slot {
    background: rgba(14, 16, 24, 0.88);
    border-top-color: rgba(255, 255, 255, 0.14);
  }
  .taskbar-icons {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .taskbar-dot {
    width: 14px;
    height: 14px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.14);
  }
  .real-island.tucked {
    border-radius: 0 0 99px 99px;
    box-shadow: 0 4px 16px color-mix(in srgb, var(--accent) 42%, transparent);
    border-color: color-mix(in srgb, var(--accent) 65%, transparent);
  }
  .real-island.expanded { border-radius: 24px; border: 1px solid var(--island-border); }
  .real-island.drag-over {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 32%, transparent), 0 18px 44px rgba(0, 0, 0, 0.5);
  }

  .island-collapsed-bar {
    height: 40px;
    padding: 0 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    cursor: pointer;
    flex: none;
  }
  .island-collapsed-left, .island-collapsed-right {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .island-status-text {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .island-pill-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 7px;
    border-radius: 999px;
    font-size: 11px;
    background: rgba(128, 128, 148, 0.16);
    color: var(--island-muted);
    white-space: nowrap;
  }
  .island-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #35e985;
    flex: none;
  }
  .island-dot.busy { background: #3d8bff; }
  .island-dot.wait { background: #ff9f43; }
  .island-dot.done { background: #35e985; }
  .island-level-bar {
    width: 84px;
    height: 6px;
    border-radius: 999px;
    background: rgba(128, 134, 152, 0.25);
    overflow: hidden;
  }
  .island-level-bar i {
    display: block;
    height: 100%;
    background: var(--accent);
    border-radius: inherit;
    transition: width var(--motion-medium) var(--motion-ease);
  }

  .island-eq {
    display: inline-flex;
    align-items: flex-end;
    gap: 2px;
    height: 12px;
  }
  .island-eq i {
    display: block;
    width: 2px;
    border-radius: 2px;
    background: var(--accent);
    animation: eqWave 1.1s var(--motion-ease) infinite alternate;
  }
  .island-eq i:nth-child(1) { height: 5px; animation-delay: 0ms; }
  .island-eq i:nth-child(2) { height: 11px; animation-delay: 180ms; }
  .island-eq i:nth-child(3) { height: 7px; animation-delay: 360ms; }
  @keyframes eqWave {
    from { height: 4px; }
    to { height: 12px; }
  }

  .island-expanded-body {
    padding: 4px 16px 14px;
    display: grid;
    gap: 10px;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--motion-base) var(--motion-ease-out);
  }
  .real-island.expanded .island-expanded-body {
    opacity: 1;
    pointer-events: auto;
  }
  .island-tabs {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .island-tabs__list {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }
  .island-tab {
    padding: 4px 10px;
    border-radius: 999px;
    border: 0;
    background: transparent;
    color: var(--island-muted);
    font: inherit;
    font-size: 11.5px;
    cursor: pointer;
    transition: background-color var(--motion-fast) var(--motion-ease), color var(--motion-fast) var(--motion-ease);
  }
  .island-tab.active {
    background: color-mix(in srgb, var(--accent) 22%, transparent);
    color: var(--island-text);
    font-weight: 600;
  }
  .island-panel-stage {
    animation: panelMaskIn var(--motion-medium) var(--motion-ease-out) backwards;
  }
  @keyframes panelMaskIn {
    from { opacity: 0; }
  }
  .island-grid {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 10px;
  }
  .island-grid-3 {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }
  .island-widget {
    padding: 10px 12px;
    border-radius: 12px;
    background: rgba(128, 134, 152, 0.12);
    border: 1px solid rgba(128, 134, 152, 0.18);
    display: grid;
    gap: 5px;
    align-content: start;
  }
  .island-widget--accent {
    border-color: color-mix(in srgb, var(--accent) 45%, rgba(128, 134, 152, 0.2));
    background: color-mix(in srgb, var(--accent) 12%, rgba(128, 134, 152, 0.1));
  }
  .island-widget__title {
    font-size: 11px;
    color: var(--island-muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .island-widget__main {
    font-size: 12.5px;
    font-weight: 600;
  }
  .island-widget__sub {
    font-size: 11px;
    color: var(--island-muted);
    line-height: 1.4;
  }
  .island-mini-actions {
    display: flex;
    gap: 6px;
    margin-top: 3px;
  }
  .island-mini-btn {
    height: 24px;
    padding: 0 10px;
    border-radius: 7px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.08);
    color: inherit;
    font: inherit;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  .island-mini-btn--allow {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
  }
  .lyric-line {
    font-size: 11.5px;
    color: var(--island-muted);
    transition: color var(--motion-base) var(--motion-ease);
  }
  .lyric-line.now {
    color: var(--island-text);

let directorTimer = 0;
let bannerTimer = 0;
let motionPreviewTimer = 0;
let morphTimers = [];

function zh(a, b) { return state.lang === "zh" ? a : b; }

function clearDirectorTimer() {
  clearTimeout(directorTimer);
  directorTimer = 0;
  morphTimers.forEach((t) => clearTimeout(t));
  morphTimers = [];
}

function applyFormPreset(presetId, rerenderCard = true) {
  const preset = ISLAND_FORMS.find((f) => f.id === presetId) || ISLAND_FORMS[0];
  state.formPreset = preset.id;
  state.edge = preset.edge;
  state.islandForm = preset.form;
  state.islandTucked = false;
  syncDevRibbon();
  if (rerenderCard) renderAll();
  else {
    renderIslandContent();
    layoutIslandAndSpotlight();
  }
}

function playAllFormsShowcase() {
  clearDirectorTimer();
  state.directorMode = "playing";
  state.tourActive = false;
  const order = ["top", "pill", "notch", "right", "bottom", "taskbar", "left", "top"];
  order.forEach((fid, idx) => {
    const t = setTimeout(() => {
      if (state.directorMode !== "playing") return;
      applyFormPreset(fid, true);
      const info = ISLAND_FORMS.find((f) => f.id === fid);
      state.directorCaption = zh(`形态巡礼：${info.name}`, `Form tour: ${info.nameEn}`);
      renderDirectorHud();
      if (idx === order.length - 1) {
        state.directorMode = "paused";
        renderDirectorHud();
      }
    }, idx * 950);
    morphTimers.push(t);
  });
}

function setIslandState(patch) {
  if (patch.expanded !== undefined) state.islandExpanded = patch.expanded;
  if (patch.tucked !== undefined) state.islandTucked = patch.tucked;
  if (patch.collapsedMode !== undefined) state.islandCollapsedMode = patch.collapsedMode;
  if (patch.volume !== undefined) state.islandVolume = patch.volume;
  if (patch.panel !== undefined) state.islandPanel = patch.panel;
  if (patch.approvalState !== undefined) state.approvalState = patch.approvalState;
  renderIslandContent();
  layoutIslandAndSpotlight();
}

function showBanner(icon, title, sub, duration = 2600) {
  const el = document.getElementById("islandBanner");
  el.innerHTML = `

      <span class="island-banner__sub">${sub}</span>
    </span>
  `;
  el.classList.add("show");
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => el.classList.remove("show"), duration);
}

function hideBanner() {
  clearTimeout(bannerTimer);
  document.getElementById("islandBanner").classList.remove("show");
}

function renderDirectorHud() {
  const hud = document.getElementById("directorHud");
  const mode = state.directorMode;
  const dotClass = mode === "playing" ? "director-dot" : mode === "user" ? "director-dot user" : "director-dot paused";
  const label = mode === "playing"
    ? zh(`自动演示：${state.directorCaption}`, `Auto-demo: ${state.directorCaption}`)
    : mode === "user"
      ? zh("已交由你操控真岛", "You're in control")
      : zh("自动演示已暂停", "Auto-demo paused");

  hud.innerHTML = `
    <span class="${dotClass}"></span>
    <span class="director-caption">${label}</span>
    <button class="director-hud__btn" id="hudToggleBtn">${mode === "playing" ? zh("暂停", "Pause") : zh("继续演示", "Resume")}</button>
    <button class="director-hud__btn" id="hudNextBtn">${zh("下一幕动画", "Next scene")}</button>
  `;
  hud.querySelector("#hudToggleBtn").addEventListener("click", () => {
    if (state.directorMode === "playing") pauseDirector("paused");
    else startChoreo(state.directorSceneIdx);
  });
  hud.querySelector("#hudNextBtn").addEventListener("click", () => {
    const next = (state.directorSceneIdx + 1) % CHOREO_SCENES.length;
    startChoreo(next);
  });
}

function pauseDirector(reason = "paused") {
  clearDirectorTimer();
  state.directorMode = reason;
  state.tourActive = false;
  renderDirectorHud();
}

function startChoreo(startIdx = 0) {
  clearDirectorTimer();
  if (state.reducedMotion) {
    state.directorMode = "paused";
    state.directorCaption = zh("减少动画模式已暂停轮播", "Paused for reduced motion");
    renderDirectorHud();
    return;
  }
  state.directorMode = "playing";
  state.tourActive = false;
  const runAt = (idx) => {
    if (state.directorMode !== "playing" || document.hidden) return;
    state.directorSceneIdx = idx % CHOREO_SCENES.length;
    const scene = CHOREO_SCENES[state.directorSceneIdx];
    state.directorCaption = zh(scene.label, scene.labelEn);
    scene.run();
    renderDirectorHud();
    updateChoreoHighlight();
    directorTimer = setTimeout(() => runAt(state.directorSceneIdx + 1), scene.duration);
  };
  runAt(startIdx);
}

function updateChoreoHighlight() {
  document.querySelectorAll("[data-choreo]").forEach((el) => {
    el.classList.toggle("active", Number(el.dataset.choreo) === state.directorSceneIdx);
  });
}

function runCapabilityTour() {
  clearDirectorTimer();
  const enabled = FEATURES.filter((f) => state.modules.has(f.id));
  if (enabled.length === 0) return;
  state.directorMode = "playing";
  state.tourActive = true;
  let i = 0;
  const tick = () => {
    if (!state.tourActive || state.directorMode !== "playing") return;
    const f = enabled[i % enabled.length];
    state.focusedFeature = f.id;
    state.directorCaption = zh(`能力巡礼：${f.name}`, `Tour: ${f.nameEn}`);
    demonstrateFeatureOnIsland(f);
    renderBody();
    renderDirectorHud();
    i += 1;
    directorTimer = setTimeout(tick, 2400);
  };
  tick();
}

function demonstrateFeatureOnIsland(f) {
  if (f.id === "messages") {
    setIslandState({ expanded: false, tucked: false, collapsedMode: "default" });
    showBanner("💬", zh("飞书 · 新消息提醒", "Feishu · Incoming"), zh("设计师：预览页的动画和布局真不错", "Designer: Love the new layout & motion"), 2300);
    return;
  }
  if (f.id === "clipboard") {
    setIslandState({ expanded: false, tucked: false, collapsedMode: "default" });
    const popup = document.getElementById("clipboardPopup");
    popup.classList.add("show");
    setTimeout(() => popup.classList.remove("show"), 1800);
    return;
  }
  if (f.id === "timer") {
    hideBanner();
    setIslandState({ expanded: false, tucked: false, collapsedMode: "timer" });
    return;
  }
  hideBanner();
  setIslandState({ expanded: true, tucked: false, panel: f.panel || "dashboard" });
}

function applyThemeVars() {
  const theme = THEMES.find((t) => t.id === state.themeId) || THEMES[0];

  const root = document.documentElement;

function layoutIslandAndSpotlight() {
  const stage = document.getElementById("desktopStage");
  const island = document.getElementById("realIsland");
  const spot = document.getElementById("spotlightRing");
  const card = document.getElementById("cardShell");
  const scrim = document.getElementById("scrim");
  const rect = stage.getBoundingClientRect();
  const steps = REGISTRY[state.track];
  const step = steps[Math.min(state.stepIdx, steps.length - 1)];

  const expanded = state.islandExpanded;
  const tucked = state.islandTucked && !expanded;
  const isNotch = state.edge === "top" && state.islandForm === "notch";
  const isPill = state.edge === "top" && state.islandForm === "pill";
  const isTaskbar = state.edge === "taskbar";

  const collapsedW = tucked
    ? 156
    : isNotch
      ? Math.min(440, rect.width - 36)
      : isTaskbar
        ? Math.min(300, rect.width - 120)
        : Math.min(368, rect.width - 36);
  const collapsedH = tucked ? 10 : isNotch ? 36 : isTaskbar ? 28 : 40;
  const expandedW = Math.min(580, rect.width - 40);
  const expandedH = 224;

  let w = expanded ? expandedW : collapsedW;
  let h = expanded ? expandedH : collapsedH;
  let x = (rect.width - w) / 2;
  let y = 0;

  if (isTaskbar) {
    y = expanded ? rect.height - 36 - h - 10 : rect.height - 32;
  } else if (state.edge === "bottom") {
    y = rect.height - 36 - h - (expanded ? 8 : 0);
  } else if (state.edge === "left") {
    if (!expanded) { w = tucked ? 10 : 44; h = 152; }
    x = expanded ? 12 : 0;
    y = Math.max(24, (rect.height - 36 - h) / 2);
  } else if (state.edge === "right") {
    if (!expanded) { w = tucked ? 10 : 44; h = 152; }
    x = rect.width - w - (expanded ? 12 : 0);
    y = Math.max(24, (rect.height - 36 - h) / 2);
  } else if (isPill) {
    y = 12;
  } else if (isNotch) {
    y = 0;
  } else {
    y = expanded ? 8 : 0;
  }

  island.className = [
    "real-island",
    `edge-${state.edge}`,
    isPill ? "form-pill" : "",
    isNotch ? "form-notch" : "",
    isTaskbar && state.taskbarLook === "transparent" ? "taskbar-transparent" : "",
    expanded ? "expanded" : "",
    tucked ? "tucked" : "",
  ].filter(Boolean).join(" ");
  island.style.left = `${Math.round(x)}px`;
  island.style.top = `${Math.round(y)}px`;
  island.style.width = `${Math.round(w)}px`;
  island.style.height = `${Math.round(h)}px`;

  document.getElementById("taskbar").classList.toggle("has-island-slot", isTaskbar);

  const pad = 8;
  spot.style.left = `${Math.round(x - pad)}px`;
  spot.style.top = `${Math.round(y - pad)}px`;
  spot.style.width = `${Math.round(w + pad * 2)}px`;
  spot.style.height = `${Math.round(h + pad * 2)}px`;
  spot.className = `spotlight-ring mode-${step.spotlight}${y > 4 || expanded || isPill || isTaskbar ? " detached" : ""}`;

  scrim.className = `scrim${step.spotlight === "off" ? " mode-off" : step.spotlight === "calm" ? " mode-soft" : ""}`;

  let cardTop = isPill ? 96 : 86;
  if (state.edge === "top" && expanded) cardTop = Math.min(248, Math.max(180, rect.height - 430));
  if (state.edge === "bottom" || isTaskbar) cardTop = expanded ? 28 : 44;
  card.style.top = `${Math.round(cardTop)}px`;
  const bottomReserve = (state.edge === "bottom" || isTaskbar) && expanded ? 280 : (state.edge === "bottom" ? 90 : 48);
  card.style.maxHeight = `${Math.max(260, Math.round(rect.height - cardTop - bottomReserve))}px`;

  const files = document.getElementById("desktopFiles");
  files.style.opacity = step.id === "practice" ? "1" : "0.4";
  files.querySelectorAll(".desktop-file").forEach((f) => {
    f.classList.toggle("pulse-hint", step.id === "practice" && !state.practice.drop);
  });
}

function renderIslandContent() {
  const island = document.getElementById("realIsland");
  if (state.islandTucked && !state.islandExpanded) {
    island.innerHTML = `<div style="width:100%;height:100%;cursor:pointer" title="${zh("轻触弹出岛", "Touch to reveal")}"></div>`;
    return;
  }

  const isSideCollapsed = (state.edge === "left" || state.edge === "right") && !state.islandExpanded;
  if (isSideCollapsed) {
    island.innerHTML = `<div style="height:100%;display:grid;place-items:center;align-content:center;gap:12px;cursor:pointer;padding:10px 0">
      ${jellySvg(24)}
      <span class="island-dot busy"></span>
      <span class="island-eq"><i></i><i></i><i></i></span>
    </div>`;

function renderHeader() {
  const header = document.getElementById("cardHeader");
  const steps = REGISTRY[state.track];
  const trackLabel = state.track === "firstRun"
    ? zh("首次安装引导", "First-run Tour")

      ? `${UPDATE_RELEASE.version} · ${zh("版本更新引导", "What's New")}`

  header.innerHTML = `
    <div class="stepper">
      ${steps.map((s, i) => `
        <button class="step-chip${i === state.stepIdx ? " active" : i < state.stepIdx ? " done" : ""}" data-jump="${i}" ${i > state.stepIdx ? "disabled" : ""}>
          <span class="step-chip__num">${i < state.stepIdx ? "✓" : i + 1}</span>

      <button class="icon-btn" id="closePreviewBtn" title="${zh("关闭引导", "Close")}">×</button>
    </div>
  `;

    btn.addEventListener("click", () => {
      const idx = Number(btn.dataset.jump);
      if (idx < state.stepIdx) goToStep(idx);

  });
  header.querySelector("#closePreviewBtn").addEventListener("click", () => {
    pauseDirector("paused");

    showBanner("👋", zh("引导已结束", "Guide closed"), zh("演示已立即清理，真岛留在屏幕顶部随时待命", "Demo cleared — Fuyu stays ready on screen"), 2500);
  });
}

function goToStep(nextIdx) {
  const steps = REGISTRY[state.track];
  state.stepIdx = Math.max(0, Math.min(nextIdx, steps.length - 1));
  const step = steps[state.stepIdx];
  clearDirectorTimer();
  hideBanner();
  if (step.autoChoreo && !state.reducedMotion) {
    renderAll();
    startChoreo(0);
  } else {
    state.directorMode = "paused";
    state.tourActive = false;
    setIslandState({ expanded: false, tucked: false, collapsedMode: "default" });
    if (step.id === "look") state.directorCaption = zh("点任意外观/动画即在真岛试播", "Click any look/motion to preview live");
    else if (step.id === "features") state.directorCaption = zh("悬停能力卡联动真岛，或一键自动巡礼", "Hover features or start Auto-Tour");
    else if (step.id === "practice") state.directorCaption = zh("交由你亲手操控真岛完成 3 项练习", "Hands-on practice — your turn");
    else state.directorCaption = zh("当前幕静默，不打扰配置", "Calm mode for unobstructed setup");
    renderAll();
  }
}

    body.querySelector("#finishPushBtn").addEventListener("click", () => {
      state.pushConfigured = true;
      state.track = "firstRun";
      syncDevRibbon();
      goToStep(REGISTRY.firstRun.length - 1);
      showBanner("📱", zh("手机推送已配置完成", "Phone push ready"), zh("Agent 完成后将自动推送到你的手机", "Agent updates will now push to your phone"), 2200);
    });
  }
}

function renderFooter() {
  const footer = document.getElementById("cardFooter");
  const steps = REGISTRY[state.track];
  const isFirst = state.stepIdx === 0;
  const isLast = state.stepIdx === steps.length - 1;
  const step = steps[state.stepIdx];
  const skippable = step.id === "envCheck" || step.id === "practice";

  const primaryText = state.track === "agentPush"
    ? zh("完成并返回", "Done")
    : isLast
      ? zh("开始使用浮屿", "Start using Fuyu")
      : isFirst && state.track === "firstRun"
        ? zh("开始定制我的浮屿", "Customize my Fuyu")
        : zh("下一步", "Next");

  footer.innerHTML = `
    <div>
      ${isLast && state.track === "firstRun"
        ? `<span style="font-size:12px;color:var(--text-muted)">${zh("按 Esc 随时退出 · 以后可在设置 → 关于重开", "Press Esc anytime · Reopen in Settings → About")}</span>`
        : `<button class="btn btn--quiet" id="exitGuideBtn">${zh("稍后再说", "Not now")}</button>`}
    </div>
    <div class="footer-nav">
      ${!isFirst ? `<button class="btn" id="prevBtn">${zh("上一步", "Back")}</button>` : ""}
      ${skippable ? `<button class="btn btn--quiet" id="skipStepBtn">${zh("跳过此步", "Skip step")}</button>` : ""}
      <button class="btn btn--primary" id="nextBtn">${primaryText}</button>
    </div>
  `;

  const exitBtn = footer.querySelector("#exitGuideBtn");
  if (exitBtn) exitBtn.addEventListener("click", () => { pauseDirector("paused"); showBanner("👋", zh("已保存当前偏好并退出", "Saved & closed"), zh("随时可在 设置 → 关于 里重新打开引导", "Reopen anytime from Settings → About"), 2400); });
  const prevBtn = footer.querySelector("#prevBtn");
  if (prevBtn) prevBtn.addEventListener("click", () => goToStep(state.stepIdx - 1));
  const skipBtn = footer.querySelector("#skipStepBtn");
  if (skipBtn) skipBtn.addEventListener("click", () => goToStep(state.stepIdx + 1));
  footer.querySelector("#nextBtn").addEventListener("click", () => {
    if (state.track === "agentPush") {
      state.pushConfigured = true;
      state.track = "firstRun";
      syncDevRibbon();
      goToStep(REGISTRY.firstRun.length - 1);
      return;
    }
    if (!isLast) goToStep(state.stepIdx + 1);
    else {
      pauseDirector("paused");
      setIslandState({ expanded: false, tucked: false, collapsedMode: "default" });
      showBanner("🎉", zh("浮屿已就绪", "Fuyu is ready"), zh("所有演示数据已清理，真岛已进入工作状态", "Demo cleared — Fuyu is ready for work"), 2600);
    }
  });
}

function handleFileDrop(filename) {
  pauseDirector("user");
  state.shelfFiles = [...state.shelfFiles, filename];
  state.practice.drop = true;
  setIslandState({ expanded: true, tucked: false, panel: "shelf" });
  renderBody();
  showBanner("📁", zh(`已接住「${filename}」`, `Caught ${filename}`), zh("已加入文件中转并点亮星星 ★", "Added to File Shelf — Star lit ★"), 2200);
}

function triggerClipboardDemo() {
  state.practice.shortcut = true;
  const popup = document.getElementById("clipboardPopup");
  document.getElementById("clipKbdHint").textContent = state.os === "mac" ? "⌘⇧V" : "Ctrl+Shift+W";
  popup.classList.add("show");
  renderBody();
  showBanner("📋", zh("剪贴板已弹出", "Clipboard opened"), zh("在任意程序里都能这样秒开历史记录 ★", "Works in any app ★"), 2200);
  setTimeout(() => popup.classList.remove("show"), 2600);
}

function syncDevRibbon() {
  document.querySelectorAll("#trackSeg .dev-btn").forEach((b) => b.classList.toggle("active", b.dataset.track === state.track));
  document.querySelectorAll("#formSeg .dev-btn").forEach((b) => b.classList.toggle("active", b.dataset.qform === state.formPreset));
  document.querySelectorAll("#osSeg .dev-btn").forEach((b) => b.classList.toggle("active", b.dataset.os === state.os));
  document.querySelectorAll("#langSeg .dev-btn").forEach((b) => b.classList.toggle("active", b.dataset.lang === state.lang));
  document.getElementById("reduceMotionBtn").textContent = state.reducedMotion ? "减少动画：开" : "减少动画：关";
  document.getElementById("reduceMotionBtn").classList.toggle("active", state.reducedMotion);
}

function renderWechatCorner() {
  const el = document.getElementById("wechatCorner");
  const lightbox = document.getElementById("qrLightbox");
  const visible = state.track === "firstRun" || state.track === "whatsNew";
  el.className = [
    "wechat-corner",
    visible ? "" : "hidden",
    state.qrCollapsed ? "collapsed" : "",
  ].filter(Boolean).join(" ");

  if (!visible) {
    state.qrZoomed = false;
    lightbox.classList.remove("open");
    return;
  }

  if (state.qrCollapsed) {
    el.innerHTML = `<span class="wechat-corner__dot"></span><span style="font-size:12px;font-weight:600">${zh("微信交流群二维码", "WeChat Group QR")}</span>`;
    el.onclick = () => {
      state.qrCollapsed = false;
      renderWechatCorner();
    };
  } else {
    el.innerHTML = `
      <div class="wechat-corner__qr">
        <img src="../assets/community/wechat-group.png" alt="${zh("浮屿微信交流群二维码", "Fuyu WeChat community QR")}" />
      </div>
      <div class="wechat-corner__meta">
        <div class="wechat-corner__head">
          <div class="wechat-corner__title"><span class="wechat-corner__dot"></span>${zh("浮屿微信交流群", "WeChat Community")}</div>
          <button class="wechat-corner__hide" id="wechatHideBtn" type="button" title="${zh("收起", "Hide")}">${zh("收起", "Hide")}</button>
        </div>
        <div class="wechat-corner__sub">${zh("点击卡片居中放大扫码，欢迎进群交流与反馈", "Click anywhere on card to zoom & scan with WeChat")}</div>
      </div>
    `;
    el.onclick = () => {
      state.qrZoomed = true;
      renderWechatCorner();
    };
    el.querySelector("#wechatHideBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      state.qrCollapsed = true;
      state.qrZoomed = false;
      renderWechatCorner();
    });
  }

  lightbox.classList.toggle("open", state.qrZoomed);
  if (state.qrZoomed) {
    lightbox.innerHTML = `
      <div class="qr-lightbox__card" id="qrLightboxCard">
        <button class="qr-lightbox__close" id="qrLightboxClose" type="button" aria-label="${zh("关闭二维码", "Close")}">×</button>
        <div class="wechat-corner__title" style="font-size:16px"><span class="wechat-corner__dot" style="width:9px;height:9px"></span>${zh("浮屿微信用户交流群", "Fuyu WeChat Community")}</div>
        <div class="qr-lightbox__img">
          <img src="../assets/community/wechat-group.png" alt="${zh("浮屿微信交流群二维码", "Fuyu WeChat community QR")}" />
        </div>
        <div style="font-size:12.5px;color:var(--text-muted);line-height:1.5">
          ${zh("打开微信扫一扫加入交流群 · 点击空白处或按 Esc 关闭", "Scan with WeChat to join · Click backdrop or press Esc to close")}
        </div>
      </div>
    `;
    lightbox.onclick = (e) => {
      if (e.target === lightbox) {
        state.qrZoomed = false;
        renderWechatCorner();
      }
    };
    lightbox.querySelector("#qrLightboxClose").addEventListener("click", () => {
      state.qrZoomed = false;
      renderWechatCorner();
    });
  }
}

function renderAll() {
  applyThemeVars();
  renderIslandContent();
  renderDirectorHud();
  renderHeader();
  renderBody();
  renderFooter();
  renderWechatCorner();
  layoutIslandAndSpotlight();
}

const islandEl = document.getElementById("realIsland");
islandEl.addEventListener("mouseenter", () => {
  if (state.islandTucked) {
    pauseDirector("user");
    setIslandState({ tucked: false, expanded: false });
    return;
  }
  if (state.directorMode === "playing") pauseDirector("user");
  if (state.expandTrigger === "hover" && !state.islandExpanded) {
    if (REGISTRY[state.track][state.stepIdx]?.id === "practice") state.practice.expand = true;
    setIslandState({ expanded: true });
    if (REGISTRY[state.track][state.stepIdx]?.id === "practice") renderBody();
  }
});
islandEl.addEventListener("mouseleave", () => {
  if (state.expandTrigger === "hover" && state.islandExpanded && state.directorMode !== "playing") {
    setIslandState({ expanded: false });
  }
});
islandEl.addEventListener("click", () => {
  pauseDirector("user");
  const nextOpen = !state.islandExpanded;
  if (nextOpen && REGISTRY[state.track][state.stepIdx]?.id === "practice") state.practice.expand = true;
  setIslandState({ expanded: nextOpen, tucked: false });
  if (REGISTRY[state.track][state.stepIdx]?.id === "practice") renderBody();
});
islandEl.addEventListener("dragover", (e) => { e.preventDefault(); islandEl.classList.add("drag-over"); });
islandEl.addEventListener("dragleave", () => islandEl.classList.remove("drag-over"));
islandEl.addEventListener("drop", (e) => {
  e.preventDefault();
  islandEl.classList.remove("drag-over");
  handleFileDrop(e.dataTransfer.getData("text/plain") || "设计稿-v3.png");
});

document.querySelectorAll(".desktop-file").forEach((el) => {
  el.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/plain", el.dataset.file));
});
document.querySelectorAll("#trackSeg .dev-btn").forEach((b) => b.addEventListener("click", () => { state.track = b.dataset.track; syncDevRibbon(); goToStep(0); }));
document.querySelectorAll("#formSeg .dev-btn").forEach((b) => b.addEventListener("click", () => { pauseDirector("user"); applyFormPreset(b.dataset.qform, true); }));
document.querySelectorAll("#osSeg .dev-btn").forEach((b) => b.addEventListener("click", () => { state.os = b.dataset.os; syncDevRibbon(); renderAll(); }));
document.querySelectorAll("#langSeg .dev-btn").forEach((b) => b.addEventListener("click", () => { state.lang = b.dataset.lang; syncDevRibbon(); renderAll(); }));
document.getElementById("reduceMotionBtn").addEventListener("click", () => {
  state.reducedMotion = !state.reducedMotion;
  if (state.reducedMotion) pauseDirector("paused");
  syncDevRibbon();
  renderAll();
});
document.getElementById("resetPracticeBtn").addEventListener("click", () => {
  state.track = "firstRun";
  state.formPreset = "top";
  state.edge = "top";
  state.islandForm = "top";
  state.taskbarLook = "transparent";
  state.themeId = "default";
  state.accent = "#74d6ff";
  state.jellyStyle = "vector";
  state.motionId = "lively";
  state.practice = { expand: false, drop: false, shortcut: false };
  state.hooksInstalled = false;
  state.macPerms = { accessibility: false, screenRecording: false };
  state.pushConfigured = false;
  state.approvalState = "pending";
  syncDevRibbon();
  goToStep(0);
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden && state.directorMode === "playing") pauseDirector("paused");
});
window.addEventListener("resize", layoutIslandAndSpotlight);
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.qrZoomed) {
    e.preventDefault();
    state.qrZoomed = false;
    renderWechatCorner();
    return;
  }
  if (e.altKey && e.key === "ArrowRight") { e.preventDefault(); goToStep(state.stepIdx + 1); }
  else if (e.altKey && e.key === "ArrowLeft") { e.preventDefault(); goToStep(state.stepIdx - 1); }
  else if ((e.metaKey || e.ctrlKey) && e.shiftKey && (e.key.toLowerCase() === "v" || e.key.toLowerCase() === "w")) {
    e.preventDefault();
    triggerClipboardDemo();
  }
});

renderAll();
startChoreo(0);
</script>
</body>
</html>
