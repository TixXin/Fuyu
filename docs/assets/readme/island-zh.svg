    <path pathLength="1" style="animation-duration:0.04s;animation-delay:1.24s" d="M49.6 -1v.8"/>
    <path pathLength="1" style="animation-duration:0.07s;animation-delay:1.30s" d="M53 3l6 -20"/>
    <path pathLength="1" style="animation-duration:0.07s;animation-delay:1.39s" d="M59 3l6 -20"/>
