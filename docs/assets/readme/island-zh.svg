    <path pathLength="1" style="animation-duration:0.05s;animation-delay:1.60s" d="M67 -10h8"/>
    <path pathLength="1" style="animation-duration:0.3s;animation-delay:1.67s" d="M76 0c2 -2 3 -6 3 -10c-1 5 -1 10 2 10c2 0 4 -5 5 -10c-1 5 -1 10 1 10c2 -2 3 -6 3 -10c-1 5 -1 10 2 10c2 0 4 -5 5 -10l-1 15c0 5 -5 5 -6 1c2 -3 6 -5 8 -6c2 -2 3 -6 3 -10c-1 5 -1 10 2 10c2 0 4 -5 5 -10c-1 5 -1 10 1 10"/>
    <path pathLength="1" style="animation-duration:0.04s;animation-delay:1.99s" d="M111.5 -1v.8"/>
    <path pathLength="1" style="animation-duration:0.26s;animation-delay:2.05s" d="M114.0 0c2 -2 3 -6 3 -10c-1 5 -1 10 3 10c2 -2 3 -6 3 -10l-1 10c1 -6 4 -10 6 -10c2 0 1 6 1 8c0 2 2 2 3 2c2 -2 5 -8 8 -9c-4 -3 -8 1 -7 5c1 4 6 3 8 -5l-1 15c0 5 -5 5 -6 1c2 -3 6 -5 9 -7"/>
    <path pathLength="1" style="animation-duration:0.05s;animation-delay:2.33s" d="M117.6 -14.5v.8"/>
    <path pathLength="1" style="animation-duration:0.16s;animation-delay:2.48s" d="M-5 -6C-12 -6 -17 -11 -16 -19"/>
