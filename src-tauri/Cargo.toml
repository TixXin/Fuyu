[package]
name = "fuyu"
version = "0.3.8-beta.1"
description = "A compact floating island shell for Windows."
authors = ["you"]
edition = "2021"
license = "GPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fuyu_lib"
# Only rlib: the template's staticlib and cdylib are for Tauri's mobile targets, and on
# Windows each build wrote a ~1 GB static .lib and linked a DLL nothing loads.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3"
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10"
flate2 = "1"
ed25519-dalek = "2"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
imap = "3.0.0-alpha.15"
imap-proto = "0.16"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "native-tls", "builder", "hostname"] }
keyring = { version = "4.2", default-features = false, features = ["v1", "windows-native-keyring-store"] }
mailparse = "0.17"
native-tls = "0.2"
pollster = "0.4"
quick-xml = "0.39"
rrule = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# No `zip`: it only unpacks v1-style .zip updates, and releases ship the bare
# installer (createUpdaterArtifacts: true). Leaves out its old zip 4.x crate.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tiny_http = "0.12"
window-vibrancy = "0.6"
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }
rqrr = { version = "0.11", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
drag = "2.1"
global-hotkey = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSImage", "NSPasteboard", "NSResponder", "NSRunningApplication", "NSWorkspace"] }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSProcessInfo", "NSString", "NSURL"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGDirectDisplay", "CGError", "CGEvent", "CGEventSource", "CGEventTypes", "CGGeometry", "CGRemoteOperation", "CGSession", "CGWindow"] }
tauri-nspanel = "2.1"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
webview2-com = "0.39"
windows = { version = "0.62", features = ["ApplicationModel", "Data_Xml_Dom", "Foundation", "Foundation_Collections", "Graphics", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Graphics_Imaging", "Media", "Media_Control", "Networking_Connectivity", "Media_Ocr", "Storage_Streams", "UI_Notifications_Management", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_FunctionDiscovery", "Win32_Devices_Properties", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Media_MediaFoundation", "Win32_Security", "Win32_Security_Credentials", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_Wmi", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Wdk_System_Threading"] }
windows-future = { version = "0.3", features = ["std"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Debug builds (`pnpm tauri dev`, cargo test, lane previews) keep file and line numbers in
# backtraces, but no full debug info: it made the dependencies several times larger and
# slower to link, and nobody steps through them in a debugger.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["ApplicationModel", "UI_Notifications_Management", "Win32_System_WinRT", "Win32_UI_Accessibility"] }
