[package]
name = "plugin-base-macros"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Plugin platform v3 base: #[host_service] turns a Rust function into a method the plugin host can call"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
