[package]
name = "plugin-base"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Plugin platform v3 base: finds or downloads Node, runs the plugin host, talks JSON-RPC to it and restarts it"
publish = false

[dependencies]
inventory = "0.3"
plugin-base-macros = { path = "../plugin-base-macros" }
pollster = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
