name: Release smoke test

# Started by `pnpm release` (scripts/release/smoke-test.mjs) while a release is still a draft:
# installs its NSIS installer on a clean Windows runner and starts it as a first-time user, then
# starts it again with Node hidden so it has to download one before its plugin host is ready (task E63.5).
# The release is published only when this passes (task D26).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (a draft), e.g. v0.3.7-beta.3
        required: false
      build_run:
        description: Or the id of a "Release Windows build" run, to test its installer before there is a release
        required: false

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      # Draft releases are only visible with write access to the repository's contents.
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/release/smoke-test.ps1
            scripts/plugins-v3/release-resources.mjs
          sparse-checkout-cone-mode: false

      - name: Download the installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          if ($env:BUILD_RUN) {
            gh run download $env:BUILD_RUN --repo $env:GITHUB_REPOSITORY --dir build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Get-ChildItem build -Recurse -Filter "*_x64-setup.exe" | Copy-Item -Destination smoke
          } elseif ($env:TAG) {
            gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern "*_x64-setup.exe" --dir smoke
          } else {
            Write-Host "::error::Give a tag or a build_run"; exit 1
          }

      - name: Install, start and uninstall
        shell: pwsh
        env:
          FUYU_SMOKE_LOGS: ${{ runner.temp }}/fuyu-smoke
        run: |
          $installer = Get-ChildItem smoke -Filter "*_x64-setup.exe" | Select-Object -First 1
          if (-not $installer) { Write-Host "::error::No installer in the draft or the build"; exit 1 }
          ./scripts/release/smoke-test.ps1 -Installer $installer.FullName

      - name: Keep fuyu.exe's logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuyu-smoke-logs
          path: ${{ runner.temp }}/fuyu-smoke
          if-no-files-found: ignore
