name: Release Windows build

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Commit to build
        required: true
      version:
        description: Version in tauri.conf.json at that commit, e.g. 0.3.9
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release config
        run: node scripts/release/windows-build.mjs config "$env:VERSION"

      - name: Build
        run: pnpm tauri build --ci --config src-tauri/tauri.release.conf.json --bundles nsis,msi

      - name: Collect
        run: node scripts/release/windows-build.mjs collect "$env:VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: fuyu-windows-${{ inputs.version }}
          path: out/
          if-no-files-found: error
          retention-days: 7
