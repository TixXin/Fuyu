# Publishes the plugin SDK packages (fuyu-plugin and create-fuyu-plugin) to npm
# when a tag like sdk-v2.0.0 is pushed. It uses npm Trusted Publishing (OIDC):
# no npm token is stored anywhere; npmjs.com trusts this workflow file in this
# repository. Setup and release steps: docs/architecture/plugins/sdk-release.md.
name: Publish SDK

on:
  push:
    tags: ["sdk-v*"]

permissions:
  contents: read
  # Lets npm verify this run (Trusted Publishing) and record provenance.
  id-token: write

concurrency:
  group: publish-sdk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Optional approval gate: add required reviewers to this environment in the repository settings.
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          # npm 11.5 or newer can publish with Trusted Publishing.
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check, test, pack and publish SDK
        run: |
          case "${GITHUB_REF_NAME}" in
            sdk-v[2-9].* | sdk-v[1-9][0-9].*)
              VERSION="${GITHUB_REF_NAME#sdk-v}"
              node -e '
                const fs = require("node:fs");
                const wanted = process.argv[1];
                for (const file of ["packages/plugin-cli/package.json", "packages/create-plugin/package.json"]) {
                  const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
                  if (pkg.version !== wanted) {
                    console.error(`error: ${file} has version ${pkg.version}, expected ${wanted}`);
                    process.exit(1);
                  }
                }
                console.log(`ok: v3 SDK packages match ${wanted}`);
              ' "$VERSION"
              node --test "packages/plugin-*/test/**/*.test.mjs" "packages/create-plugin/test/**/*.test.mjs" tests/scripts/pack-npm-sdk.test.mjs
              node scripts/plugins-v3/pack-npm-sdk.mjs --version "$VERSION" --out node_modules/.cache/npm-sdk
              for dir in node_modules/.cache/npm-sdk/fuyu-plugin node_modules/.cache/npm-sdk/create-fuyu-plugin; do
                name=$(node -p "JSON.parse(require('node:fs').readFileSync('$dir/package.json', 'utf8')).name")
                version=$(node -p "JSON.parse(require('node:fs').readFileSync('$dir/package.json', 'utf8')).version")
                if npm view "$name@$version" version >/dev/null 2>&1; then
                  echo "$name@$version is already on npm; skipped."
                else
                  (cd "$dir" && npm publish --access public --provenance)
                fi
              done
              ;;
            *)
              echo "error: ${GITHUB_REF_NAME} is not a v3 SDK tag (sdk-v2.0.0 or later); the v2 SDK packages were removed in E36.6.6" >&2
              exit 1
              ;;
          esac
