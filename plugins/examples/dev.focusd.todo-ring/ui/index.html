<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Todo progress ring</title>
    <link rel="stylesheet" href="ring.css" />
  </head>
  <body>
    <main class="ring" id="ring">
      <div class="ring__dial">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
              <stop class="sweep__from" offset="0" />
              <stop class="sweep__to" offset="1" />
            </linearGradient>
          </defs>
          <circle class="ring__track" cx="60" cy="60" r="50" />
          <circle class="ring__value" cx="60" cy="60" r="50" pathLength="100" />
        </svg>
        <div class="ring__center">
          <strong id="percent">–</strong>
          <span id="left"></span>
        </div>
      </div>
      <section class="ring__side">
        <p class="ring__label" id="label"></p>
        <p class="ring__counts"><strong id="done"></strong><span id="total"></span></p>
        <ul class="ring__next" id="next"></ul>
        <p class="ring__note" id="note"></p>
      </section>
      <button id="refresh" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /></svg>
      </button>
    </main>
    <script src="ring.js"></script>
  </body>
</html>
