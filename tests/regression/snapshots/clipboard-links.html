<body>
  <div id="root">
    <div style="display: flex; align-items: center; gap: 8px; width: 360px; height: 38px; padding: 0px 18px; background: var(--island-fill, #000); border-radius: 19px"></div>
    <div class="island-list-page" style="width: 520px; margin-top: 16px; background: var(--island-fill, #000)">
      <div aria-label="链接书签" class="island-list clipboard-links" role="list">
        <article class="island-list-row clipboard-link-row" role="listitem">
          <button aria-label="打开 b.com › docs" class="island-list-row__hit" title="https://b.com/docs" type="button"></button>
          <button aria-label="拖动排序" class="clipboard-link-row__grip" title="拖动或按 ↑↓ 调整顺序" type="button">
            <svg aria-hidden="true" class="lucide lucide-grip-vertical" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5714285714285716" viewBox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg"></svg>
          </button>
          <span aria-hidden="true" class="island-list-row__lead">
            <svg aria-hidden="true" class="lucide lucide-globe" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"></svg>
          </span>
          <span class="island-list-row__text">
            <span class="island-list-row__main">
              b.com › docs
            </span>
            <span class="island-list-row__meta">
              b.com › docs
            </span>
          </span>
          <span class="island-list-row__actions">
            <button aria-label="删除书签" class="island-list-icon-button" title="删除书签" type="button">
              <svg aria-hidden="true" class="lucide lucide-trash2 lucide-trash-2" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5714285714285716" viewBox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg"></svg>
            </button>
          </span>
        </article>
        <article class="island-list-row clipboard-link-row" role="listitem">
          <button aria-label="打开 Site A" class="island-list-row__hit" title="https://a.com/" type="button"></button>

          </span>
          <span class="island-list-row__text">
            <span class="island-list-row__main">
              Site A
            </span>
            <span class="island-list-row__meta">
              a.com
            </span>
          </span>
          <span class="island-list-row__actions">
            <button aria-label="删除书签" class="island-list-icon-button" title="删除书签" type="button">
              <svg aria-hidden="true" class="lucide lucide-trash2 lucide-trash-2" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5714285714285716" viewBox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg"></svg>
            </button>
          </span>
        </article>

          </button>
          <span aria-hidden="true" class="island-list-row__lead">

      </div>
    </div>
  </div>
