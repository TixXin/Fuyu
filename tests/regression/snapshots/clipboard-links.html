        <span class="clipboard-entry-icon clipboard-copy-notice__icon">
          <svg aria-hidden="true" class="lucide lucide-clipboard-list" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
            <rect height="4" rx="1" ry="1" width="8" x="8" y="2"></rect>

            <path d="M12 11h4"></path>
            <path d="M12 16h4"></path>
            <path d="M8 11h.01"></path>
            <path d="M8 16h.01"></path>
          </svg>
        </span>
        <span class="clipboard-copy-notice__text">
          已复制 · a.com
        </span>
      </span>

        <button aria-label="已加入书签" aria-pressed="true" class="clipboard-copy-notice__action" disabled="" title="已加入书签" type="button">

            <path d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"></path>
            <path d="m9 10 2 2 4-4"></path>
          </svg>

        <button aria-label="关闭" class="clipboard-copy-notice__action" title="关闭" type="button">
          <svg aria-hidden="true" class="lucide lucide-x" fill="none" height="13" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="13" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
        </button>
      </span>
