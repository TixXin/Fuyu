<body>
  <div id="root">
    <div style="position: relative; width: 360px; height: 38px; border-radius: 19px; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0px 18px; background: var(--island-background-color, #000)">
        <span class="screenshot-notice recording-notice" role="status">
          <span class="screenshot-notice__text recording-notice__text">
            录屏失败：no graphics card
          </span>
        </span>
        <span class="screenshot-notice__actions">
          <button aria-label="关闭" class="screenshot-notice__action" title="关闭" type="button">
            <svg aria-hidden="true" class="lucide lucide-x" fill="none" height="13" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="13" xmlns="http://www.w3.org/2000/svg"></svg>
          </button>
        </span>
      </div>
    </div>
  </div>
</body>
