<body>
  <div id="page">
    <div class="host host--island">
      <div>
        <span class="healthy">
          岛屿内容
        </span>
      </div>
      <span class="host__label">
        没出错
      </span>
    </div>
    <div class="host host--island">
      <div></div>
      <span class="host__label">
        第一次出错：等重载
      </span>
    </div>
    <div class="host host--island">
      <div>
        <div class="window-crash window-crash--island" role="alert">
          <div class="window-crash__pill">
            <span class="window-crash__text">
              浮屿出了点问题
            </span>
            <button class="window-crash__button window-crash__button--primary" type="button">
              <svg aria-hidden="true" class="lucide lucide-rotate-cw" fill="none" height="12" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewBox="0 0 24 24" width="12" xmlns="http://www.w3.org/2000/svg"></svg>
              重新加载
            </button>
          </div>
        </div>
      </div>
      <span class="host__label">
        岛：再次出错
      </span>
    </div>
    <div class="host host--island">
      <div>
        <div class="window-crash window-crash--island" role="alert">
          <div class="window-crash__pill">
            <span class="window-crash__text">
              浮屿出了点问题
            </span>
            <button class="window-crash__button window-crash__button--primary" type="button">
              <svg aria-hidden="true" class="lucide lucide-rotate-cw" fill="none" height="12" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewBox="0 0 24 24" width="12" xmlns="http://www.w3.org/2000/svg"></svg>
              重新加载
            </button>
          </div>
        </div>
      </div>
      <span class="host__label">
        岛：到时间自动再试
      </span>
    </div>
    <div class="host host--window">
      <div>
        <div class="window-crash window-crash--window" role="alert">
          <div class="window-crash__card">
            <p class="window-crash__title">
              这个窗口出了点问题
            </p>
            <p class="window-crash__detail">
              错误已记到数据文件夹的 frontend-errors.log。重新加载通常就能恢复。
            </p>
            <div class="window-crash__actions">
              <button class="window-crash__button" type="button">
                关闭
              </button>
              <button class="window-crash__button window-crash__button--primary" type="button">
                <svg aria-hidden="true" class="lucide lucide-rotate-cw" fill="none" height="12" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewBox="0 0 24 24" width="12" xmlns="http://www.w3.org/2000/svg"></svg>
                重新加载
              </button>
            </div>
          </div>
        </div>
      </div>
      <span class="host__label">
        普通窗口：再次出错
      </span>
    </div>
    <div class="host host--silent">
      <div></div>
      <span class="host__label">
        拖岛辅助线：不显示
      </span>
    </div>
    <div class="host host--window">
      <div>
        <div class="window-crash window-crash--window" role="alert">
          <div class="window-crash__card">
            <p class="window-crash__title">
              这个窗口出了点问题
            </p>
            <p class="window-crash__detail">
              错误已记到数据文件夹的 frontend-errors.log。重新加载通常就能恢复。
            </p>
            <div class="window-crash__actions">
              <button class="window-crash__button" type="button">
                关闭
              </button>
              <button class="window-crash__button window-crash__button--primary" type="button">
                <svg aria-hidden="true" class="lucide lucide-rotate-cw" fill="none" height="12" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewBox="0 0 24 24" width="12" xmlns="http://www.w3.org/2000/svg"></svg>
                重新加载
              </button>
            </div>
          </div>
        </div>
      </div>
      <span class="host__label">
        启动失败
      </span>
    </div>
  </div>
</body>
