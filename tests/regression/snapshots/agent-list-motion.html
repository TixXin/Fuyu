<body>

            <span class="agent-session__main">
              <span class="agent-session__heading">
                <span class="agent-session__title">
                  <span class="agent-session__project">
                    e
                    ·
                  </span>
                  会话 e
                </span>
                <span class="agent-session__agent">
                  <img alt="" aria-hidden="true" class="agent-provider-icon agent-provider-icon--claudeCode" draggable="false" height="14" src="/src/assets/brands/claude-code.png" width="14">
                </span>
                <span class="agent-session__time">
                  &lt;1m
                </span>
              </span>
            </span>
          </button>
        </li>
        <li data-session-key="claudeCode:c">
          <button class="agent-session agent-session--completed agent-session--light-done agent-session--compact" type="button">
            <span aria-label="已完成" class="agent-session__dot" role="img" title="已完成"></span>
            <span class="agent-session__main">

                <span class="agent-session__title">
                  <span class="agent-session__project">
                    c
                    ·
                  </span>
                  会话 c
                </span>
                <span class="agent-session__agent">
                  <img alt="" aria-hidden="true" class="agent-provider-icon agent-provider-icon--claudeCode" draggable="false" height="14" src="/src/assets/brands/claude-code.png" width="14">
                </span>
                <span class="agent-session__time">
                  1 分
                </span>
              </span>
            </span>
          </button>
        </li>
        <li class="" data-session-key="claudeCode:a">
          <button class="agent-session agent-session--waiting agent-session--light-needs agent-session--compact" type="button">
            <span aria-label="等你确认" class="agent-session__dot" role="img" title="等你确认"></span>
            <span class="agent-session__main">
              <span class="agent-session__heading">
                <span class="agent-session__title">
                  <span class="agent-session__project">
                    a
                    ·
                  </span>
                  会话 a
                </span>
                <span class="agent-session__meta">
                  等待确认
                </span>
                <span class="agent-session__agent">
                  <img alt="" aria-hidden="true" class="agent-provider-icon agent-provider-icon--claudeCode" draggable="false" height="14" src="/src/assets/brands/claude-code.png" width="14">
                </span>
                <span class="agent-session__time">
                  4 分

              </span>
            </span>
          </button>
        </li>
      </ul>
    </section>
