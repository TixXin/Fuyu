<body>
  <div id="root">
    <div class="screenshot-overlay screenshot-overlay--long" style="cursor: nwse-resize">
      <canvas class="screenshot-overlay__picture" height="813" width="1280"></canvas>
      <div class="screenshot-overlay__selection screenshot-overlay__selection--long" style="left: 60px; top: 60px; width: 200px; height: 240px">
        <span class="screenshot-overlay__size">
          200 × 2,400
        </span>
      </div>
      <div aria-label="长截图" class="long-shot-bar long-shot-bar--end" role="toolbar" style="left: 272px; top: 60px">
        <div class="long-shot-bar__head">
          <svg aria-hidden="true" class="lucide lucide-square-bottom-dashed-scissors" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg">
            <line x1="5" x2="19" y1="3" y2="3"></line>
            <line x1="3" x2="3" y1="5" y2="19"></line>
            <line x1="21" x2="21" y1="5" y2="19"></line>
            <line x1="9" x2="10" y1="21" y2="21"></line>
            <line x1="14" x2="15" y1="21" y2="21"></line>
            <path d="M 3 5 A2 2 0 0 1 5 3"></path>
            <path d="M 19 3 A2 2 0 0 1 21 5"></path>
            <path d="M 5 21 A2 2 0 0 1 3 19"></path>
            <path d="M 21 19 A2 2 0 0 1 19 21"></path>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <line x1="9.56066" x2="12" y1="9.56066" y2="12"></line>
            <line x1="17" x2="14.82" y1="17" y2="14.82"></line>
            <circle cx="8.5" cy="15.5" r="1.5"></circle>
            <line x1="9.56066" x2="17" y1="14.43934" y2="7"></line>
          </svg>
          <strong>
            长截图
          </strong>
          <span class="long-shot-bar__height">
            高 2,400 px
          </span>
        </div>
        <div aria-hidden="true" class="long-shot-bar__film">
          <span class="long-shot-bar__film-empty"></span>
          <span class="long-shot-bar__frames">
            5 屏
          </span>
        </div>
        <div aria-hidden="true" class="long-shot-bar__meter">
          <span style="transform: scaleX(0.12)"></span>
        </div>
        <p class="long-shot-bar__state" role="status">
          到底了，点 ✓ 复制
        </p>
        <div class="long-shot-bar__actions">
          <button aria-label="继续自动滚动（空格）" class="long-shot-bar__button" title="继续自动滚动（空格）" type="button">
            <svg aria-hidden="true" class="lucide lucide-play" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
              <path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"></path>
            </svg>
          </button>
          <button aria-label="取消（Esc）" class="long-shot-bar__button" title="取消（Esc）" type="button">
            <svg aria-hidden="true" class="lucide lucide-x" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
          </button>
          <button aria-label="保存（Ctrl+S）" class="long-shot-bar__button" title="保存（Ctrl+S）" type="button">
            <svg aria-hidden="true" class="lucide lucide-download" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 15V3"></path>
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <path d="m7 10 5 5 5-5"></path>
            </svg>
          </button>
          <button aria-label="完成并复制（Enter）" class="long-shot-bar__button long-shot-bar__button--primary" title="完成并复制（Enter）" type="button">
            <svg aria-hidden="true" class="lucide lucide-check" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
              <path d="M20 6 9 17l-5-5"></path>
            </svg>
          </button>
        </div>
        <p class="long-shot-bar__keys">
          空格 开始 / 暂停 · Enter 完成 · Esc 取消
        </p>
      </div>
      <div class="screenshot-overlay__guide screenshot-overlay__guide--h" style="top: 60px"></div>
      <div class="screenshot-overlay__guide screenshot-overlay__guide--h" style="top: 299px"></div>
      <div class="screenshot-overlay__guide screenshot-overlay__guide--v" style="left: 60px"></div>
      <div class="screenshot-overlay__guide screenshot-overlay__guide--v" style="left: 259px"></div>
    </div>
  </div>
</body>
