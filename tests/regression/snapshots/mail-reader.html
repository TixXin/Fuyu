<body>
  <div id="fixture">
    <section class="message-fixture" style="height: 350px">
      <header class="fixture-heading">
        fly-island
        <span>
          消息
        </span>
      </header>
      <div class="message-panel">
        <section aria-label="邮箱" class="qq-panel qq-mail-panel">
          <header class="qq-panel__header">
            <div aria-label="消息来源" class="message-sources" role="group">
              <button aria-label="QQ 通知" aria-pressed="false" type="button">
                <img alt="" aria-hidden="true" class="message-brand-icon message-brand-icon--qq" draggable="false" height="16" src="/src/assets/brands/qq.png" width="16">
                <span>
                  QQ
                </span>
                <span class="message-source-count">
                  1
                </span>
              </button>
              <button aria-label="微信提醒" aria-pressed="false" type="button">
                <img alt="" aria-hidden="true" class="message-brand-icon message-brand-icon--wechat" draggable="false" height="16" src="/src/assets/brands/wechat.png" width="16">
                <span>
                  微信
                </span>
                <span aria-label="有新提醒" class="message-source-dot"></span>
              </button>
              <button aria-label="邮箱" aria-pressed="true" type="button">
                <img alt="" aria-hidden="true" class="message-brand-icon message-brand-icon--qqMail" draggable="false" height="16" src="/src/assets/brands/mail.png" width="16">
                <span>
                  邮箱
                </span>
              </button>
            </div>
            <div class="qq-panel__toolbar">
              <button aria-label="打开邮箱网页" class="icon-button" type="button">
                <svg aria-hidden="true" class="lucide lucide-arrow-up-right" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
                  <path d="M7 7h10v10"></path>
                  <path d="M7 17 17 7"></path>
                </svg>
              </button>
            </div>
          </header>
          <div class="qq-panel__empty qq-mail-setup" role="status">
            <span class="message-empty-icon">
              <img alt="" aria-hidden="true" class="message-brand-icon message-brand-icon--qqMail" draggable="false" height="28" src="/src/assets/brands/mail.png" width="28">
            </span>
            <span>
              还没有连接邮箱
            </span>
            <button class="message-action" type="button">
              <svg aria-hidden="true" class="lucide lucide-settings2 lucide-settings-2" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg">
                <path d="M14 17H5"></path>
                <path d="M19 7h-9"></path>
                <circle cx="17" cy="17" r="3"></circle>
                <circle cx="7" cy="7" r="3"></circle>
              </svg>
              在设置中添加邮箱
            </button>
          </div>
        </section>
      </div>
    </section>
  </div>
</body>
