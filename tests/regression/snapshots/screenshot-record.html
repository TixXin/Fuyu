<body>
  <div id="root">
    <div class="screenshot-overlay" style="cursor: crosshair">
      <canvas class="screenshot-overlay__picture" height="813" width="1280"></canvas>
      <canvas class="screenshot-overlay__annotations" height="813" width="1280"></canvas>
      <div class="screenshot-overlay__selection" style="left: 0px; top: 0px; width: 1280px; height: 813px">
        <span class="screenshot-overlay__handle" style="left: 0px; top: 0px"></span>
        <span class="screenshot-overlay__handle" style="left: 640px; top: 0px"></span>
        <span class="screenshot-overlay__handle" style="left: 1280px; top: 0px"></span>
        <span class="screenshot-overlay__handle" style="left: 1280px; top: 406.5px"></span>
        <span class="screenshot-overlay__handle" style="left: 1280px; top: 813px"></span>
        <span class="screenshot-overlay__handle" style="left: 640px; top: 813px"></span>
        <span class="screenshot-overlay__handle" style="left: 0px; top: 813px"></span>
        <span class="screenshot-overlay__handle" style="left: 0px; top: 406.5px"></span>
        <span class="screenshot-overlay__size screenshot-overlay__size--inside">
          1280
          ×
          813
        </span>
      </div>
      <div class="screenshot-overlay__guide screenshot-overlay__guide--h" style="top: 0px"></div>
      <div class="screenshot-overlay__guide screenshot-overlay__guide--h" style="top: 812px"></div>
      <div class="screenshot-overlay__guide screenshot-overlay__guide--v" style="left: 0px"></div>
      <div class="screenshot-overlay__guide screenshot-overlay__guide--v" style="left: 1279px"></div>
      <div class="screenshot-sheet screenshot-sheet--faded" style="left: 12px; top: 628px">
        <div class="screenshot-sheet__head" title="拖动标题栏换到别的角">
          <svg aria-hidden="true" class="lucide lucide-grip-vertical screenshot-sheet__grip" fill="none" height="13" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="13" xmlns="http://www.w3.org/2000/svg"></svg>
          <span class="screenshot-sheet__title">
            快捷键
          </span>
          <button aria-label="收起（?）" class="screenshot-sheet__collapse" title="收起（?）" type="button">
            <svg aria-hidden="true" class="lucide lucide-chevron-down" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg"></svg>
          </button>
        </div>
        <div class="screenshot-sheet__grid">
          <div class="screenshot-sheet__section">
            选区
          </div>
          <div class="screenshot-sheet__row">
            <span>
              选区域
            </span>
            <span class="screenshot-sheet__keys">
              <span class="screenshot-sheet__word">
                拖动
              </span>
            </span>
          </div>
          <div class="screenshot-sheet__row">
            <span>
              选窗口 / 控件
            </span>
            <span class="screenshot-sheet__keys">
              <span class="screenshot-sheet__word">
                单击
              </span>
            </span>
          </div>
          <div class="screenshot-sheet__section">
            录屏
          </div>
          <div class="screenshot-sheet__row">
            <span>
              整个屏幕
            </span>
            <span class="screenshot-sheet__keys">
              <kbd>
                F
              </kbd>
            </span>
          </div>
          <div class="screenshot-sheet__row">
            <span>
              MP4 / GIF
            </span>
            <span class="screenshot-sheet__keys">
              <kbd>
                G
              </kbd>
            </span>
          </div>
          <div class="screenshot-sheet__row">
            <span>
              取消
            </span>
            <span class="screenshot-sheet__keys">
              <kbd>
                Esc
              </kbd>
            </span>
          </div>
          <div class="screenshot-sheet__row">
            <span>
              收起说明
            </span>
            <span class="screenshot-sheet__keys">
              <kbd>
                ?
              </kbd>
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
