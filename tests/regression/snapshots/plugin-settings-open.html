<body>
  <section class="settings-stage" id="stage">
    <div class="plugin-page" data-plugin-page="open">
      <div class="plugin-page__summary" data-summary="true">
        <b>
          装了 4 个插件
        </b>
        <span>
          <i class="plugin-page__dot plugin-page__dot--ok"></i>
          3 个在运行
        </span>
        <span>
          <i class="plugin-page__dot plugin-page__dot--off"></i>
          1 个已停用
        </span>
      </div>
      <div class="plugin-page__toolbar">
        <label class="plugin-search">
          <svg aria-hidden="true" class="lucide lucide-search" fill="none" height="13" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" width="13" xmlns="http://www.w3.org/2000/svg"></svg>
          <input aria-label="搜索已装的插件" placeholder="搜索已装的插件" type="search" value="">
        </label>
        <div aria-label="筛选" class="plugin-page__filters" role="group">
          <button aria-pressed="true" class="plugin-chip" data-filter="all" type="button">
            全部
            <span class="plugin-chip__count">
              4
            </span>
          </button>
          <button aria-pressed="false" class="plugin-chip" data-filter="on" type="button">
            已启用
            <span class="plugin-chip__count">
              3
            </span>
          </button>
          <button aria-pressed="false" class="plugin-chip" data-filter="off" type="button">
            已停用
            <span class="plugin-chip__count">
              1
            </span>
          </button>
          <button aria-pressed="false" class="plugin-chip" data-filter="attention" disabled="" type="button">
            需处理
            <span class="plugin-chip__count">
              0
            </span>
          </button>
        </div>
      </div>
      <div class="plugin-list">
        <div class="plugin-row" data-dot="ok" data-plugin="@someone/clock">
          <span aria-hidden="true" class="plugin-icon">
            世
            <span class="plugin-icon__dot plugin-icon__dot--ok"></span>
          </span>
          <div class="plugin-row__main">
            <div class="plugin-row__line">
              <button class="plugin-row__name" title="世界时钟" type="button">
                世界时钟
              </button>
              <span class="plugin-row__version">
                v
                2.0.0
              </span>
            </div>
            <p class="plugin-row__desc">
              收起时显示另一个时区的时间
            </p>
            <div class="plugin-row__facts">
              someone · 插件市场
            </div>
          </div>
          <div class="plugin-row__aside">
            <button aria-label="设置" class="plugin-icon-btn" data-action="open-settings" title="设置" type="button">
              <svg aria-hidden="true" class="lucide lucide-settings" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg"></svg>
            </button>
            <div class="plugin-menu">
              <button aria-expanded="false" aria-haspopup="menu" aria-label="更多操作" class="plugin-icon-btn" title="更多操作" type="button">
                <svg aria-hidden="true" class="lucide lucide-ellipsis" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"></svg>
              </button>
            </div>
            <span class="plugin-row__switch">
              <span class="settings-switch">
                <input aria-label="启用「世界时钟」" checked="" id="_id1_" role="switch" type="checkbox">
                <span aria-hidden="true" class="settings-switch__track"></span>
              </span>
            </span>
          </div>
        </div>
        <div class="plugin-row" data-dot="ok" data-plugin="@fuyu/weather">
          <span aria-hidden="true" class="plugin-icon">
            天
            <span class="plugin-icon__dot plugin-icon__dot--ok"></span>
          </span>
          <div class="plugin-row__main">
            <div class="plugin-row__line">
              <button class="plugin-row__name" title="天气" type="button">
                天气
              </button>
              <span class="plugin-badge plugin-badge--official">
                官方
              </span>
              <span class="plugin-row__version">
                v
                1.2.0
              </span>
            </div>
            <p class="plugin-row__desc">
              在岛上看实时气温和逐小时预报
            </p>
            <div class="plugin-row__facts">
              插件市场 · 官方
            </div>
          </div>
          <div class="plugin-row__aside">
            <button aria-label="设置" class="plugin-icon-btn" data-action="open-settings" title="设置" type="button">
              <svg aria-hidden="true" class="lucide lucide-settings" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg"></svg>
            </button>
            <div class="plugin-menu">
              <button aria-expanded="false" aria-haspopup="menu" aria-label="更多操作" class="plugin-icon-btn" title="更多操作" type="button">
                <svg aria-hidden="true" class="lucide lucide-ellipsis" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"></svg>
              </button>
            </div>
            <span class="plugin-row__switch">
              <span class="settings-switch">
                <input aria-label="启用「天气」" checked="" id="_id2_" role="switch" type="checkbox">
                <span aria-hidden="true" class="settings-switch__track"></span>
              </span>
            </span>
          </div>
        </div>
        <div class="plugin-row plugin-row--off" data-dot="off" data-plugin="@me/gadget">
          <span aria-hidden="true" class="plugin-icon plugin-icon--dim">
            G
            <span class="plugin-icon__dot plugin-icon__dot--off"></span>
          </span>
          <div class="plugin-row__main">
            <div class="plugin-row__line">
              <button class="plugin-row__name" title="Gadget" type="button">
                Gadget
              </button>
              <span class="plugin-badge plugin-badge--warn">
                未经审核
              </span>
              <span class="plugin-row__state">
                ·
                已停用
              </span>
            </div>
            <div class="plugin-row__facts">
              me · 本地文件（未经审核）
            </div>
          </div>
          <div class="plugin-row__aside">
            <button aria-label="设置" class="plugin-icon-btn" data-action="open-settings" title="设置" type="button">
              <svg aria-hidden="true" class="lucide lucide-settings" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg"></svg>
            </button>
            <div class="plugin-menu">
              <button aria-expanded="false" aria-haspopup="menu" aria-label="更多操作" class="plugin-icon-btn" title="更多操作" type="button">
                <svg aria-hidden="true" class="lucide lucide-ellipsis" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"></svg>
              </button>
            </div>
            <span class="plugin-row__switch">
              <span class="settings-switch">
                <input aria-label="启用「Gadget」" id="_id3_" role="switch" type="checkbox">
                <span aria-hidden="true" class="settings-switch__track"></span>
              </span>
            </span>
          </div>
        </div>
        <div class="plugin-row" data-dot="ok" data-plugin="my-local-tool">
          <span aria-hidden="true" class="plugin-icon">
            M
            <span class="plugin-icon__dot plugin-icon__dot--ok"></span>
          </span>
          <div class="plugin-row__main">
            <div class="plugin-row__line">
              <button class="plugin-row__name" title="my-local-tool" type="button">
                my-local-tool
              </button>
            </div>
            <div class="plugin-row__facts">
              本地开发
            </div>
          </div>
          <div class="plugin-row__aside">
            <button aria-label="设置" class="plugin-icon-btn" data-action="open-settings" title="设置" type="button">
              <svg aria-hidden="true" class="lucide lucide-settings" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg"></svg>
            </button>
            <div class="plugin-menu">
              <button aria-expanded="false" aria-haspopup="menu" aria-label="更多操作" class="plugin-icon-btn" title="更多操作" type="button">
                <svg aria-hidden="true" class="lucide lucide-ellipsis" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
      <p class="plugin-foot" data-footnote="true">
        浮屿自带的功能（待办、音乐、剪贴板……）不算插件，在
        <button class="plugin-link" data-action="open-overview" type="button">
          「概览」
        </button>
        里开关。
      </p>
      <input accept=".fuyu" aria-hidden="true" class="plugin-file-input" data-testid="plugin-file-input" tabindex="-1" type="file">
    </div>
    <div class="plugin-dialog__backdrop">
      <div aria-label="天气" aria-modal="true" class="plugin-dialog" data-plugin-detail="@fuyu/weather" role="dialog">
        <div class="plugin-dialog__head">
          <span aria-hidden="true" class="plugin-icon plugin-icon--lg">
            天
            <span class="plugin-icon__dot plugin-icon__dot--ok"></span>
          </span>
          <div class="plugin-dialog__heading">
            <div class="plugin-row__line plugin-row__line--wrap">
              <span class="plugin-dialog__title">
                天气
              </span>
              <span class="plugin-badge plugin-badge--official">
                官方
              </span>
            </div>
            <span class="plugin-dialog__sub">
              v1.2.0 · 运行中
            </span>
          </div>
          <div class="plugin-dialog__head-actions">
            <span class="plugin-row__switch">
              <span class="settings-switch">
                <input aria-label="启用「天气」" checked="" id="_id4_" role="switch" type="checkbox">
                <span aria-hidden="true" class="settings-switch__track"></span>
              </span>
            </span>
            <button aria-label="关闭" class="plugin-icon-btn" title="关闭" type="button">
              <svg aria-hidden="true" class="lucide lucide-x" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg"></svg>
            </button>
          </div>
        </div>
        <div class="plugin-tabs" role="tablist">
          <button aria-selected="false" class="plugin-tabs__tab" data-tab="overview" role="tab" tabindex="-1" type="button">
            概览
          </button>
          <button aria-selected="true" class="plugin-tabs__tab" data-tab="settings" role="tab" tabindex="0" type="button">
            设置
          </button>
          <button aria-selected="false" class="plugin-tabs__tab" data-tab="commands" role="tab" tabindex="-1" type="button">
            命令与快捷键
          </button>
          <button aria-selected="false" class="plugin-tabs__tab" data-tab="activity" role="tab" tabindex="-1" type="button">
            运行情况
          </button>
        </div>
        <div class="plugin-dialog__body" data-panel="settings" role="tabpanel">
          <div class="plugin-detail__settings">
            <section class="plugins-v3__schema-form" data-plugin-schema-form="@fuyu/weather">
              <div class="plugins-v3__subhead">
                <h4 class="plugins-v3__subheading">
                  插件设置
                </h4>
                <button class="plugins-v3__btn" data-action="reset-plugin-config" type="button">
                  <svg aria-hidden="true" class="lucide lucide-rotate-ccw" fill="none" height="12" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" width="12" xmlns="http://www.w3.org/2000/svg"></svg>
                  <span>
                    恢复默认设置
                  </span>
                </button>
              </div>
              <div class="plugins-v3__schema-list">
                <div class="plugins-v3__schema-row" data-schema-field="autoRefresh">
                  <div class="plugins-v3__schema-copy">
                    <label class="plugins-v3__schema-label" for="_id5_-autoRefresh">
                      自动刷新
                    </label>
                  </div>
                  <div class="plugins-v3__schema-control">
                    <span class="settings-switch">
                      <input checked="" id="_id5_-autoRefresh" role="switch" type="checkbox">
                      <span aria-hidden="true" class="settings-switch__track"></span>
                    </span>
                  </div>
                </div>
                <div class="plugins-v3__schema-row" data-schema-field="unit">
                  <div class="plugins-v3__schema-copy">
                    <label class="plugins-v3__schema-label" for="_id5_-unit">
                      单位
                    </label>
                  </div>
                  <div class="plugins-v3__schema-control">
                    <select class="plugins-v3__schema-select" id="_id5_-unit">
                      <option value="celsius">
                        celsius
                      </option>
                      <option value="fahrenheit">
                        fahrenheit
                      </option>
                    </select>
                  </div>
                </div>
              </div>
            </section>
            <p class="plugin-callout plugin-detail__no-settings">
              这个插件没有可以改的设置。
            </p>
          </div>
        </div>
        <div class="plugin-dialog__foot">
          <button class="plugin-btn plugin-btn--sm plugin-btn--ghost" data-action="view-in-market" type="button">
            <svg aria-hidden="true" class="lucide lucide-store" fill="none" height="13" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" width="13" xmlns="http://www.w3.org/2000/svg"></svg>
            在市场查看
          </button>
          <span class="plugin-dialog__grow"></span>
          <button class="plugin-btn plugin-btn--sm plugin-btn--danger" data-action="uninstall-plugin" type="button">
            <svg aria-hidden="true" class="lucide lucide-trash2 lucide-trash-2" fill="none" height="13" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" width="13" xmlns="http://www.w3.org/2000/svg"></svg>
            卸载
          </button>
        </div>
      </div>
    </div>
  </section>
</body>
