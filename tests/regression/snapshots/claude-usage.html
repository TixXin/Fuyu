          <div aria-hidden="false" class="island__collapsed">
            <span class="island__pulse island__pulse--agent-idle" data-opens-bar=""></span>
            <button aria-controls="island-panel" aria-expanded="false" aria-label="待办：剩余3个待办，点击展开" class="island__open-button" data-tooltip="" type="button">
              <span aria-atomic="true" aria-live="polite" class="island__summary" data-direction="restore" role="status">
                <span class="island__summary-layer">
                  <span class="island__summary-row">
                    <span class="island__active-task">
                      剩余3个待办
                    </span>
                  </span>
                </span>
              </span>
            </button>

              <span class="island-hover-card__anchor">

                  <svg aria-hidden="true" class="lucide lucide-gauge" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.1" viewBox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg"></svg>
                </button>
              </span>
            </div>
            <button aria-label="收起岛屿" class="island__quiet-button" data-tooltip="" type="button"></button>
          </div>
          <div aria-hidden="true" class="island__expanded" id="island-panel" inert="">
            <header class="island__header">
              <div class="island__header-start">
                <div class="island__title">
                  <svg aria-label="AI Agent 空闲或已完成" class="lucide lucide-bot island__agent-status-icon island__agent-status-icon--idle" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"></svg>
                </div>
                <div aria-label="岛屿编辑" class="editor-dots">
                  <button aria-label="任务清单 (Alt+1)" aria-pressed="true" class="dot-button dot-button--todo dot-button--active" type="button">
                    <svg aria-hidden="true" class="lucide lucide-list-todo" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.8800000000000003" viewBox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg"></svg>
                  </button>
                  <button aria-label="剪贴板历史 (Alt+2)" aria-pressed="false" class="dot-button dot-button--clipboard" type="button">
                    <svg aria-hidden="true" class="lucide lucide-clipboard-list" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.8800000000000003" viewBox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg"></svg>
                  </button>
                  <button aria-label="文件中转 (Alt+3)" aria-pressed="false" class="dot-button dot-button--shelf" type="button">
                    <svg aria-hidden="true" class="lucide lucide-inbox" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.8800000000000003" viewBox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg"></svg>
                  </button>
                </div>
              </div>
              <button aria-label="收起岛屿" class="island__collapse-target" data-tooltip="" data-window-drag="false" type="button"></button>
              <div class="window-actions">
                <button aria-label="设置" class="icon-button island-settings-button" type="button">
                  <svg aria-hidden="true" class="lucide lucide-settings" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"></svg>
                </button>
                <button aria-label="快捷翻译" class="icon-button island-translate-button" type="button">
                  <svg aria-hidden="true" class="lucide lucide-languages" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"></svg>
                </button>
                <button aria-label="回到主屏顶部居中" class="icon-button island-reset-button island-reset-button--available" type="button">
                  <svg aria-hidden="true" class="lucide lucide-rotate-ccw" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"></svg>
                </button>
                <button aria-label="最小化到托盘" class="icon-button" type="button">
                  <svg aria-hidden="true" class="lucide lucide-minus" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"></svg>
                </button>
              </div>
            </header>
            <div class="island__content">
              <span>
                待办清单
              </span>
            </div>
          </div>
        </div>
        <div aria-hidden="true" class="island-resize-hints">
          <div class="island-resize-lines">
            <span class="island-resize-hint island-resize-hint--left"></span>
            <span class="island-resize-hint island-resize-hint--right"></span>
          </div>
        </div>
      </section>
    </div>
  </div>
  <div id="plan-keys">
    <div class="settings-row settings-row--indent" data-search="off">
      <div class="settings-row__main">
        <div class="settings-row__text">
          <span class="settings-row__title">
            GLM API Key
          </span>
          <span class="settings-row__description">
            <span data-plan-key-status="glm" role="status">
              未保存
            </span>
          </span>
        </div>
        <div class="settings-row__control">
          <button class="settings-link-button" disabled="" type="button">
            保存
          </button>
        </div>
      </div>
      <input aria-label="GLM API Key" autocomplete="off" class="settings-input" data-plan-key="glm" placeholder="粘贴 API Key" spellcheck="false" type="password" value="">
    </div>
  </div>
</body>
