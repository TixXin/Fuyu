<body style="background: linear-gradient(135deg, rgb(58, 63, 85), rgb(106, 90, 122) 50%, rgb(43, 74, 106))">
  <div id="root">
    <main class="onboarding stage--font-system">
      <div class="onboarding__card" style="left: 40px; top: 40px; width: 340px; max-height: 820px">
        <section class="onboarding__body">
          <div class="onboarding__heading">
            <h1 class="onboarding__title">
              推送到手机
            </h1>
            <p class="onboarding__lead">
              Agent 做完或等你回复时，把消息推到手机，也能在手机上直接回它。经 cc-connect 接一个聊天机器人就行。
            </p>
          </div>
          <ol aria-label="第 5 步，共 5 步：测试" class="push-act__steps">
            <li class="push-act__step push-act__step--done">
              安装
            </li>
            <li class="push-act__step push-act__step--done">
              建项目
            </li>
            <li class="push-act__step push-act__step--done">
              选平台
            </li>
            <li class="push-act__step push-act__step--done">
              接机器人
            </li>
            <li aria-current="step" class="push-act__step push-act__step--active">
              测试
            </li>
          </ol>
          <p class="push-act__lead">
            在手机上给每个机器人发一句话，收到后这里会打勾，再发一条测试消息回手机。
          </p>
          <ul class="push-act__list">
            <li class="push-act__row" data-project="local-claudecode">
              <svg aria-hidden="true" class="lucide lucide-circle push-act__icon" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="10"></circle>
              </svg>
              <div class="push-act__main">
                <span class="push-act__name">
                  local-claudecode
                </span>
                <span class="push-act__note">
                  还没收到：在手机上给机器人发一句话
                </span>
              </div>
            </li>
            <li class="push-act__row" data-project="my-codex">
              <svg aria-hidden="true" class="lucide lucide-check push-act__ok" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 6 9 17l-5-5"></path>
              </svg>
              <div class="push-act__main">
                <span class="push-act__name">
                  my-codex
                </span>
                <span class="push-act__note">
                  已收到手机发来的消息
                </span>
              </div>
              <button class="onboarding__button" type="button">
                <svg aria-hidden="true" class="lucide lucide-send" fill="none" height="13" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="13" xmlns="http://www.w3.org/2000/svg">
                  <path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"></path>
                  <path d="m21.854 2.147-10.94 10.939"></path>
                </svg>
                发测试消息
              </button>
            </li>
          </ul>
        </section>
        <footer class="onboarding__footer">
          <div class="onboarding__nav">
            <button class="onboarding__button" data-nav="back" type="button">
              back
            </button>
            <button class="onboarding__button" data-nav="next" type="button">
              next
            </button>
          </div>
        </footer>
      </div>
    </main>
  </div>
</body>
