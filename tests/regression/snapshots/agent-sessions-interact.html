<body>
  <div id="fixture" style="width: 400px">
    <section aria-label="Agent 会话" class="agent-sessions" data-view="focused">
      <div class="agent-sessions__stage">
        <div class="agent-view agent-view--focused">
          <div aria-label="Agent 会话" class="agent-v__bar" role="tablist">
            <button aria-selected="true" class="agent-v__tab agent-v__tab--on" role="tab" type="button">
              <span>
                全部
              </span>
              <span class="agent-v__count">
                3
              </span>
            </button>
            <button aria-selected="false" class="agent-v__tab" role="tab" type="button">
              <span>
                需处理
              </span>
              <span class="agent-v__count">
                0
              </span>
            </button>
            <button aria-selected="false" class="agent-v__tab" role="tab" type="button">
              <span>
                运行中
              </span>
              <span class="agent-v__count">
                1
              </span>
            </button>
            <button aria-selected="false" class="agent-v__tab" role="tab" type="button">
              <span>
                已完成
              </span>
              <span class="agent-v__count">
                2
              </span>
            </button>
          </div>
          <ul class="agent-sessions__list agent-sessions__list--focused agent-sessions__list--archivable agent-sessions__list--menu">
            <li data-session-key="claudeCode:a">
              <span class="island-hover-card__anchor agent-session__hover">
                <button class="agent-session agent-focused__row agent-focused__row--active agent-session--running agent-v--light-working agent-session--light-working agent-card--lively" type="button">
                  <span class="agent-v__mark">
                    <span aria-label="运行中" class="agent-session__dot" role="img" title="运行中"></span>
                  </span>
                  <span class="agent-focused__main">
                    <span class="agent-focused__heading">
                      <span class="agent-v__proj">
                        fuyu
                      </span>
                      <span class="agent-v__title">
                        Agent 页会话行的右键菜单、键盘选行和悬停卡片，标题很长时卡片里要写全
                      </span>
                      <span class="agent-v__model" title="Opus 5.5">
                        <span class="agent-v__model-name">
                          Opus 5.5
                        </span>
                      </span>
                      <span class="agent-v__trailing">
                        <span class="agent-session__agent">
                          <img alt="" aria-hidden="true" class="agent-provider-icon agent-provider-icon--claudeCode" draggable="false" height="14" src="/src/assets/brands/claude-code.png" width="14">
                        </span>
                        <span class="agent-session__time"></span>
                      </span>
                    </span>
                    <span class="agent-focused__sub">
                      <span class="agent-v__activity">
                        <span class="agent-v__reply">
                          已经加好菜单。
                        </span>
                      </span>
                      <span class="agent-focused__status">
                        <span class="agent-session__elapsed">
                          已运行 # 分 ## 秒
                        </span>
                      </span>
                    </span>
                  </span>
                </button>
              </span>
              <span class="agent-session__more">
                <button aria-expanded="false" aria-haspopup="menu" aria-label="「Agent 页会话行的右键菜单、键盘选行和悬停卡片，标题很长时卡片里要写全」的更多操作" class="island-list-icon-button" title="「Agent 页会话行的右键菜单、键盘选行和悬停卡片，标题很长时卡片里要写全」的更多操作" type="button">
                  <svg aria-hidden="true" class="lucide lucide-ellipsis" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg"></svg>
                </button>
              </span>
              <button aria-label="归档「Agent 页会话行的右键菜单、键盘选行和悬停卡片，标题很长时卡片里要写全」" class="agent-session__archive" title="归档「Agent 页会话行的右键菜单、键盘选行和悬停卡片，标题很长时卡片里要写全」" type="button">
                <svg aria-hidden="true" class="lucide lucide-archive" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg"></svg>
              </button>
            </li>
            <li class="agent-focused__section" data-session-key="section:done">
              <span>
                最近完成 · 2
              </span>
              <button aria-expanded="true" class="agent-focused__toggle" type="button">
                <svg aria-hidden="true" class="lucide lucide-chevron-down" fill="none" height="13" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="13" xmlns="http://www.w3.org/2000/svg"></svg>
                <span>
                  收起
                </span>
              </button>
            </li>
            <li data-session-key="codex:b">
              <span class="island-hover-card__anchor agent-session__hover">
                <button class="agent-session agent-focused__row agent-focused__row--done agent-session--completed agent-v--light-done agent-session--light-done" type="button">
                  <span class="agent-v__mark">
                    <span aria-label="已完成" class="agent-session__dot" role="img" title="已完成"></span>
                  </span>
                  <span class="agent-v__proj agent-v__proj--quiet">
                    MioPicFlow
                  </span>
                  <span class="agent-v__title">
                    恢复发布机环境
                  </span>
                  <span class="agent-v__trailing">
                    <span class="agent-session__agent">
                      <img alt="" aria-hidden="true" class="agent-provider-icon agent-provider-icon--codex" draggable="false" height="13" src="/src/assets/brands/codex.webp" width="13">
                    </span>
                    <span class="agent-session__time">
                      <span class="agent-session__age">
                        14m
                      </span>
                    </span>
                  </span>
                </button>
              </span>
              <span class="agent-session__more">
                <button aria-expanded="false" aria-haspopup="menu" aria-label="「恢复发布机环境」的更多操作" class="island-list-icon-button" title="「恢复发布机环境」的更多操作" type="button">
                  <svg aria-hidden="true" class="lucide lucide-ellipsis" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg"></svg>
                </button>
              </span>
              <button aria-label="归档「恢复发布机环境」" class="agent-session__archive" title="归档「恢复发布机环境」" type="button">
                <svg aria-hidden="true" class="lucide lucide-archive" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg"></svg>
              </button>
            </li>
            <li data-session-key="claudeCode:c">
              <span class="island-hover-card__anchor agent-session__hover">
                <button class="agent-session agent-focused__row agent-focused__row--done agent-session--completed agent-v--light-done agent-session--light-done" type="button">
                  <span class="agent-v__mark">
                    <span aria-label="已完成" class="agent-session__dot" role="img" title="已完成"></span>
                  </span>
                  <span class="agent-v__proj agent-v__proj--quiet">
                    fuyu
                  </span>
                  <span class="agent-v__remote">
                    devbox
                  </span>
                  <span class="agent-v__title">
                    远程主机上的会话
                  </span>
                  <span class="agent-v__trailing">
                    <span class="agent-session__agent">
                      <img alt="" aria-hidden="true" class="agent-provider-icon agent-provider-icon--claudeCode" draggable="false" height="13" src="/src/assets/brands/claude-code.png" width="13">
                    </span>
                    <span class="agent-session__time">
                      <span class="agent-session__age">
                        1h
                      </span>
                    </span>
                  </span>
                </button>
              </span>
              <span class="agent-session__more">
                <button aria-expanded="false" aria-haspopup="menu" aria-label="「远程主机上的会话」的更多操作" class="island-list-icon-button" title="「远程主机上的会话」的更多操作" type="button">
                  <svg aria-hidden="true" class="lucide lucide-ellipsis" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg"></svg>
                </button>
              </span>
              <button aria-label="归档「远程主机上的会话」" class="agent-session__archive" title="归档「远程主机上的会话」" type="button">
                <svg aria-hidden="true" class="lucide lucide-archive" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg"></svg>
              </button>
            </li>
          </ul>
        </div>
      </div>
    </section>
  </div>
</body>
