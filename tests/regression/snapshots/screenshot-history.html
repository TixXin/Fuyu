<body>
  <div id="root">
    <div style="width: 520px; height: 320px; padding: 12px; background: var(--island-background-color, #000)">
      <section aria-label="截图历史" class="island-list-page screenshot-history">
        <div class="island-list-bar">
          <strong class="screenshot-history__title">
            截图历史
          </strong>
        </div>
        <div class="island-list-empty">
          <span aria-hidden="true" class="island-list-empty__icon">
            <svg aria-hidden="true" class="lucide lucide-images" fill="none" height="22" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" width="22" xmlns="http://www.w3.org/2000/svg"></svg>
          </span>
          <strong>
            还没有截图
          </strong>
          <small>
            复制、保存或贴到屏幕上的截图会留在这里。
          </small>
        </div>
      </section>
    </div>
  </div>
  <div id="clip">
    <div style="width: 520px; height: 320px; padding: 12px; background: var(--island-background-color, #000)">
      <section aria-label="剪贴板历史" class="island-list-page clipboard-page">
        <header class="island-list-bar">
          <div aria-label="剪贴板栏目" class="island-list-chips" role="group">
            <button aria-pressed="true" class="island-list-chip" type="button">
              全部
            </button>
            <button aria-pressed="false" class="island-list-chip" type="button">
              收藏
            </button>
            <button aria-pressed="false" class="island-list-chip" type="button">
              图片
            </button>
            <button aria-pressed="false" class="island-list-chip" type="button">
              文件
            </button>
            <button aria-pressed="false" class="island-list-chip" type="button">
              截图
            </button>
            <button aria-pressed="false" class="island-list-chip" type="button">
              书签
            </button>
          </div>
          <span class="island-list-count">
            0
          </span>
          <button aria-expanded="false" aria-haspopup="menu" aria-label="更多操作" class="island-list-icon-button" title="更多操作" type="button">
            <svg aria-hidden="true" class="lucide lucide-ellipsis" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg"></svg>
          </button>
        </header>
        <label class="island-list-search">
          <svg aria-hidden="true" class="lucide lucide-search" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.1" viewBox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg"></svg>
          <input aria-label="搜索剪贴板内容或备注" placeholder="搜索内容、备注或 #标签" type="search" value="">
          <kbd title="打开剪贴板的快捷键">
            Ctrl+Shift+W
          </kbd>
        </label>
        <div class="island-list-empty">
          <span aria-hidden="true" class="island-list-empty__icon">
            <svg aria-hidden="true" class="lucide lucide-clipboard-list" fill="none" height="22" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" width="22" xmlns="http://www.w3.org/2000/svg"></svg>
          </span>
          <strong>
            复制文本或图片后会出现在这里
          </strong>
          <small>
            复制的文字、图片和文件都会记在这里，点一条就复制回去。
          </small>
        </div>
      </section>
    </div>
  </div>
</body>
