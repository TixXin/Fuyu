<body>
  <div id="root">
    <div style="width: 520px; height: 320px; padding: 12px; background: var(--island-background-color, #000)">
      <section aria-label="截图历史" class="island-list-page screenshot-history">
        <div class="island-list-bar">
          <strong class="screenshot-history__title">
            截图历史
          </strong>
        </div>
        <div class="island-list-empty">
          <span aria-hidden="true" class="island-list-empty__icon">
            <svg aria-hidden="true" class="lucide lucide-images" fill="none" height="22" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" width="22" xmlns="http://www.w3.org/2000/svg">
              <path d="m22 11-1.296-1.296a2.4 2.4 0 0 0-3.408 0L11 16"></path>
              <path d="M4 8a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2"></path>
              <circle cx="13" cy="7" fill="currentColor" r="1"></circle>
              <rect height="14" rx="2" width="14" x="8" y="2"></rect>
            </svg>
          </span>
          <strong>
            还没有截图
          </strong>
          <small>
            复制、保存或贴到屏幕上的截图会留在这里。
          </small>
        </div>
      </section>
    </div>
  </div>
  <div id="clip">
    <div style="width: 520px; height: 320px; padding: 12px; background: var(--island-background-color, #000)">
      <section aria-label="剪贴板历史" class="island-list-page clipboard-page">
        <header class="island-list-bar">
          <div aria-label="剪贴板栏目" class="island-list-chips" role="group">
            <button aria-pressed="true" class="island-list-chip" type="button">
              全部
            </button>
            <button aria-pressed="false" class="island-list-chip" type="button">
              收藏
            </button>
            <button aria-pressed="false" class="island-list-chip" type="button">
              图片
            </button>
            <button aria-pressed="false" class="island-list-chip" type="button">
              文件
            </button>
            <button aria-pressed="false" class="island-list-chip" type="button">
              截图
            </button>
            <button aria-pressed="false" class="island-list-chip" type="button">
              书签
            </button>
          </div>
          <span class="island-list-count">
            0
          </span>
          <button aria-expanded="false" aria-haspopup="menu" aria-label="更多操作" class="island-list-icon-button" title="更多操作" type="button">
            <svg aria-hidden="true" class="lucide lucide-ellipsis" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="1"></circle>
              <circle cx="19" cy="12" r="1"></circle>
              <circle cx="5" cy="12" r="1"></circle>
            </svg>
          </button>
        </header>
        <label class="island-list-search">
          <svg aria-hidden="true" class="lucide lucide-search" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.1" viewBox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg">
            <path d="m21 21-4.34-4.34"></path>
            <circle cx="11" cy="11" r="8"></circle>
          </svg>
          <input aria-label="搜索剪贴板内容或备注" placeholder="搜索内容、备注或 #标签" type="search" value="">
          <kbd title="打开剪贴板的快捷键">
            Ctrl+Shift+W
          </kbd>
        </label>
        <div class="island-list-empty">
          <span aria-hidden="true" class="island-list-empty__icon">
            <svg aria-hidden="true" class="lucide lucide-clipboard-list" fill="none" height="22" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" width="22" xmlns="http://www.w3.org/2000/svg">
              <rect height="4" rx="1" ry="1" width="8" x="8" y="2"></rect>
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <path d="M12 11h4"></path>
              <path d="M12 16h4"></path>
              <path d="M8 11h.01"></path>
              <path d="M8 16h.01"></path>
            </svg>
          </span>
          <strong>
            复制文本或图片后会出现在这里
          </strong>
          <small>
            复制的文字、图片和文件都会记在这里，点一条就复制回去。
          </small>
        </div>
      </section>
    </div>
  </div>
</body>
