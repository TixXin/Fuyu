<body>
  <div id="fixture">
    <section class="message-fixture" style="height: 350px; width: 560px">
      <header class="fixture-heading">
        fuyu
        <span>
          消息
        </span>
      </header>
      <div class="message-panel">
        <div class="feed-shell" data-layout="focus">
          <section aria-label="一次一条" class="feed-layout focus-layout focus-layout--done">
            <header class="feed-head">
              <span class="feed-head__title">
                一次一条
              </span>
              <span class="feed-tools">
                <button aria-expanded="false" aria-haspopup="menu" aria-label="消息页布局：一次一条" class="feed-icon-button" title="消息页布局：一次一条" type="button">
                  <svg aria-hidden="true" class="lucide lucide-gallery-vertical-end" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg"></svg>
                </button>
                <button aria-expanded="false" aria-haspopup="menu" aria-label="更多操作" class="feed-icon-button" title="更多操作" type="button">
                  <svg aria-hidden="true" class="lucide lucide-ellipsis" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg"></svg>
                </button>
              </span>
            </header>
            <div class="feed-notices">
              <div class="feed-notice" data-status="off" role="status">
                <svg aria-hidden="true" class="lucide lucide-bell-off" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg"></svg>
                <span class="feed-notice__text">
                  <strong>
                    QQ 已关闭
                  </strong>
                </span>
                <button class="feed-button feed-button--solid" type="button">
                  打开
                </button>
              </div>
            </div>
            <div class="feed-empty" role="status">
              <span aria-hidden="true" class="feed-empty__logos">
                <span class="feed-empty__logo">
                  <img alt="" aria-hidden="true" class="message-brand-icon message-brand-icon--qq" draggable="false" height="30" src="/src/assets/brands/qq.png" width="30">
                </span>
                <span class="feed-empty__logo">
                  <img alt="" aria-hidden="true" class="message-brand-icon message-brand-icon--wechat" draggable="false" height="30" src="/src/assets/brands/wechat.png" width="30">
                </span>
                <span class="feed-empty__logo">
                  <img alt="" aria-hidden="true" class="message-brand-icon message-brand-icon--qqMail" draggable="false" height="30" src="/src/assets/brands/mail.png" width="30">
                </span>
                <span class="feed-empty__check">
                  <svg aria-hidden="true" class="lucide lucide-check" fill="none" height="13" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" viewBox="0 0 24 24" width="13" xmlns="http://www.w3.org/2000/svg"></svg>
                </span>
              </span>
              <h4>
                都看完了
              </h4>
              <p>
                上一条 09:59 · 微信「小林」
                · 今天一共 6 条
              </p>
              <span class="feed-status-line">
                <span class="feed-status" data-status="off">
                  <i aria-hidden="true"></i>
                  QQ 已关闭
                </span>
                <span class="feed-status" data-status="ok">
                  <i aria-hidden="true"></i>
                  微信接收中
                </span>
                <span class="feed-status" data-status="ok">
                  <i aria-hidden="true"></i>
                  邮箱接收中
                </span>
                <span class="feed-status" data-status="ok">
                  <i aria-hidden="true"></i>
                  Telegram 接收中
                </span>
              </span>
            </div>
          </section>
        </div>
      </div>
    </section>
  </div>
</body>
