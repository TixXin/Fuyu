<body style="background: linear-gradient(135deg, rgb(58, 63, 85), rgb(106, 90, 122) 50%, rgb(43, 74, 106))">
  <div id="root">
    <main class="onboarding stage--font-system onboarding--light">
      <div class="onboarding__card" style="left: 40px; top: 40px; width: 340px; max-height: 820px">
        <section class="onboarding__body">
          <div class="onboarding__heading">
            <h1 class="onboarding__title">
              推送到手机
            </h1>
            <p class="onboarding__lead">
              Agent 做完或等你回复时，把消息推到手机，也能在手机上直接回它。经 cc-connect 接一个聊天机器人就行。
            </p>
          </div>
          <ol aria-label="第 4 步，共 5 步：接机器人" class="push-act__steps">
            <li class="push-act__step push-act__step--done">
              安装
            </li>
            <li class="push-act__step push-act__step--done">
              建项目
            </li>
            <li class="push-act__step push-act__step--done">
              选平台
            </li>
            <li aria-current="step" class="push-act__step push-act__step--active">
              接机器人
            </li>
            <li class="push-act__step">
              测试
            </li>
          </ol>
          <p class="push-act__lead">
            每个项目接一个Telegram机器人。接好一个才写进配置，一个一个来。
          </p>
          <ul class="push-act__list">
            <li class="push-act__row push-act__row--connect" data-project="local-claudecode">
              <div class="push-act__main">
                <span class="push-act__name">
                  local-claudecode
                </span>
                <span class="push-act__note">
                  本机 · Claude Code
                </span>
              </div>
              <span class="push-act__done">
                <svg aria-hidden="true" class="lucide lucide-check" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20 6 9 17l-5-5"></path>
                </svg>
                已接上
              </span>
            </li>
            <li class="push-act__row push-act__row--connect" data-project="my-codex">
              <div class="push-act__main">
                <span class="push-act__name">
                  my-codex
                </span>
                <span class="push-act__note">
                  本机 · Codex
                </span>
              </div>
              <span class="push-act__done">
                <svg aria-hidden="true" class="lucide lucide-check" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20 6 9 17l-5-5"></path>
                </svg>
                已接上
              </span>
            </li>
            <li class="push-act__row push-act__row--connect" data-project="devbox-claudecode">
              <div class="push-act__main">
                <span class="push-act__name">
                  devbox-claudecode
                </span>
                <span class="push-act__note">
                  devbox · Claude Code
                </span>
              </div>
              <span class="push-act__done">
                <svg aria-hidden="true" class="lucide lucide-check" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20 6 9 17l-5-5"></path>
                </svg>
                已接上
              </span>
            </li>
          </ul>
          <button class="push-act__skip" type="button">
            先不设置推送
          </button>
        </section>
        <footer class="onboarding__footer">
          <div class="onboarding__nav">
            <button class="onboarding__button" data-nav="back" type="button">
              back
            </button>
            <button class="onboarding__button" data-nav="next" type="button">
              next
            </button>
          </div>
        </footer>
      </div>
    </main>
  </div>
</body>
