<body>
  <div id="fixture">
    <div class="stage" style="--collapsed-island-width: 320px">
      <section aria-label="待办：剩余3个待办" class="island island--collapsed island--todo island--appearance-classic island--detached island--title-hidden">
        <div class="island__surface">
          <div aria-hidden="false" class="island__collapsed">
            <span class="island__pulse island__pulse--agent-idle" data-opens-bar=""></span>
            <button aria-controls="island-panel" aria-expanded="false" aria-label="待办：剩余3个待办，点击展开" class="island__open-button" data-tooltip="" type="button">
              <span aria-atomic="true" aria-live="polite" class="island__summary" data-direction="restore" role="status">
                <span class="island__summary-layer">
                  <span class="island__summary-row island__summary-row--animated">
                    <span class="island__active-task">
                      剩余3个待办
                    </span>
                  </span>
                </span>
              </span>
            </button>
          </div>
          <div aria-hidden="true" class="island__expanded" id="island-panel" inert="">
            <header class="island__header">
              <div class="island__header-start">
                <div class="island__title">
                  <button aria-label=" · 查看 Agent 会话 (Alt+1)" aria-pressed="false" class="island__agent-button" type="button">
                    <svg aria-hidden="true" class="lucide lucide-bot island__agent-status-icon island__agent-status-icon--idle" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.7" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
                      <path d="M12 8V4H8"></path>
                      <rect height="12" rx="2" width="16" x="4" y="8"></rect>
                      <path d="M2 14h2"></path>
                      <path d="M20 14h2"></path>
                      <path d="M15 13v2"></path>
                      <path d="M9 13v2"></path>
                    </svg>
                  </button>
                </div>
                <div aria-label="岛屿编辑" class="editor-dots">
                  <button aria-label="任务清单 (Alt+2)" aria-pressed="true" class="dot-button dot-button--todo dot-button--active" type="button">
                    <svg aria-hidden="true" class="lucide lucide-list-todo" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.8800000000000003" viewBox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg">
                      <path d="M13 5h8"></path>
                      <path d="M13 12h8"></path>
                      <path d="M13 19h8"></path>
                      <path d="m3 17 2 2 4-4"></path>
                      <rect height="6" rx="1" width="6" x="3" y="4"></rect>
                    </svg>
                  </button>
                  <button aria-label="Music (Alt+3)" aria-pressed="false" class="dot-button dot-button--music" type="button">
                    <svg aria-hidden="true" class="lucide lucide-music" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.8800000000000003" viewBox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg">
                      <path d="M9 18V5l12-2v13"></path>
                      <circle cx="6" cy="18" r="3"></circle>
                      <circle cx="18" cy="16" r="3"></circle>
                    </svg>
                  </button>
                </div>
              </div>
              <button aria-label="收起岛屿" class="island__collapse-target" data-tooltip="" data-window-drag="false" type="button"></button>
              <div class="window-actions">
                <button aria-label="设置" class="icon-button island-settings-button" type="button">
                  <svg aria-hidden="true" class="lucide lucide-settings" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
                <button aria-label="消息：QQ 0 条通知 (Alt+4)" aria-pressed="false" class="icon-button island-message-button" type="button">
                  <svg aria-hidden="true" class="lucide lucide-bell" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10.268 21a2 2 0 0 0 3.464 0"></path>
                    <path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path>
                  </svg>
                </button>
                <button aria-label="快捷翻译" class="icon-button island-translate-button" type="button">
                  <svg aria-hidden="true" class="lucide lucide-languages" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
                    <path d="m5 8 6 6"></path>
                    <path d="m4 14 6-6 2-3"></path>
                    <path d="M2 5h12"></path>
                    <path d="M7 2h1"></path>
                    <path d="m22 22-5-10-5 10"></path>
                    <path d="M14 18h6"></path>
                  </svg>
                </button>
                <button aria-label="回到主屏顶部居中" class="icon-button island-reset-button island-reset-button--available" type="button">
                  <svg aria-hidden="true" class="lucide lucide-rotate-ccw" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                    <path d="M3 3v5h5"></path>
                  </svg>
                </button>
                <button aria-label="最小化到托盘" class="icon-button" type="button">
                  <svg aria-hidden="true" class="lucide lucide-minus" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
                    <path d="M5 12h14"></path>
                  </svg>
                </button>
              </div>
            </header>
            <div class="island__content">
              <span>
                待办清单
              </span>
            </div>
          </div>
        </div>
        <div aria-hidden="true" class="island-resize-hints">
          <div class="island-resize-lines">
            <span class="island-resize-hint island-resize-hint--left"></span>
            <span class="island-resize-hint island-resize-hint--right"></span>
          </div>
        </div>
      </section>
    </div>
    <span class="agent-probe"></span>
  </div>
</body>
