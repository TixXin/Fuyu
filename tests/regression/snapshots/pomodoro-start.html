<body>
  <div id="widget">
    <div class="island-widget daily-pomodoro">
      <svg aria-hidden="true" class="daily-ring" viewBox="0 0 84 84">
        <circle class="daily-ring__track" cx="42" cy="42" r="36"></circle>
        <circle class="daily-ring__value" cx="42" cy="42" r="36" stroke-dasharray="226.&lt;ts&gt;" stroke-dashoffset="226.&lt;ts&gt;"></circle>
      </svg>
      <div class="daily-pomodoro__center">
        <button class="daily-big daily-pomodoro__time daily-pomodoro__length" title="一轮 25 分钟，点一下换时长" type="button">
          25:00
        </button>
        <div class="daily-pomodoro__buttons">
          <button aria-label="开始" class="daily-button" title="开始" type="button">
            <svg aria-hidden="true" class="lucide lucide-play" fill="none" height="11" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" viewBox="0 0 24 24" width="11" xmlns="http://www.w3.org/2000/svg"></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
