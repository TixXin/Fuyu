<body>
  <div id="root">
    <div class="screenshot-overlay" style="cursor: crosshair">
      <canvas class="screenshot-overlay__picture" height="813" width="1280"></canvas>
      <canvas class="screenshot-overlay__annotations" height="813" width="1280"></canvas>
      <div class="screenshot-overlay__selection" style="left: 40px; top: 40px; width: 80px; height: 80px">
        <span class="screenshot-overlay__handle" style="left: 0px; top: 0px"></span>
        <span class="screenshot-overlay__handle" style="left: 40px; top: 0px"></span>
        <span class="screenshot-overlay__handle" style="left: 80px; top: 0px"></span>
        <span class="screenshot-overlay__handle" style="left: 80px; top: 40px"></span>
        <span class="screenshot-overlay__handle" style="left: 80px; top: 80px"></span>
        <span class="screenshot-overlay__handle" style="left: 40px; top: 80px"></span>
        <span class="screenshot-overlay__handle" style="left: 0px; top: 80px"></span>
        <span class="screenshot-overlay__handle" style="left: 0px; top: 40px"></span>
        <span class="screenshot-overlay__size">
          80
          ×
          80
        </span>
      </div>
      <div aria-label="截图工具栏" class="screenshot-overlay__toolbar" role="toolbar" style="left: 4px; top: 128px">
        <div class="screenshot-overlay__toolbar-row">
          <button aria-label="矩形" aria-pressed="false" class="screenshot-overlay__button" title="矩形" type="button">
            <svg aria-hidden="true" class="lucide lucide-square" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg">
              <rect height="18" rx="2" width="18" x="3" y="3"></rect>
            </svg>
          </button>
          <button aria-label="椭圆" aria-pressed="false" class="screenshot-overlay__button" title="椭圆" type="button">
            <svg aria-hidden="true" class="lucide lucide-circle" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="10"></circle>
            </svg>
          </button>
          <button aria-label="箭头" aria-pressed="false" class="screenshot-overlay__button" title="箭头" type="button">
            <svg aria-hidden="true" class="lucide lucide-move-up-right" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg">
              <path d="M13 5H19V11"></path>
              <path d="M19 5L5 19"></path>
            </svg>
          </button>
          <button aria-label="画笔" aria-pressed="false" class="screenshot-overlay__button" title="画笔" type="button">
            <svg aria-hidden="true" class="lucide lucide-pencil" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg">
              <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path>
              <path d="m15 5 4 4"></path>
            </svg>
          </button>
          <button aria-label="荧光笔" aria-pressed="false" class="screenshot-overlay__button" title="荧光笔" type="button">
            <svg aria-hidden="true" class="lucide lucide-highlighter" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg">
              <path d="m9 11-6 6v3h9l3-3"></path>
              <path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"></path>
            </svg>
          </button>
          <button aria-label="文字" aria-pressed="false" class="screenshot-overlay__button" title="文字" type="button">
            <svg aria-hidden="true" class="lucide lucide-type" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 4v16"></path>
              <path d="M4 7V5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2"></path>
              <path d="M9 20h6"></path>
            </svg>
          </button>
          <button aria-label="马赛克" aria-pressed="false" class="screenshot-overlay__button" title="马赛克" type="button">
            <svg aria-hidden="true" class="lucide lucide-grid3x3 lucide-grid-3x3" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg">
              <rect height="18" rx="2" width="18" x="3" y="3"></rect>
              <path d="M3 9h18"></path>
              <path d="M3 15h18"></path>
              <path d="M9 3v18"></path>
              <path d="M15 3v18"></path>
            </svg>
          </button>
          <button aria-label="序号" aria-pressed="false" class="screenshot-overlay__button" title="序号" type="button">
            <svg aria-hidden="true" class="lucide lucide-hash" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg">
              <line x1="4" x2="20" y1="9" y2="9"></line>
              <line x1="4" x2="20" y1="15" y2="15"></line>
              <line x1="10" x2="8" y1="3" y2="21"></line>
              <line x1="16" x2="14" y1="3" y2="21"></line>
            </svg>
          </button>
          <span class="screenshot-overlay__separator"></span>
          <button aria-label="撤销（Ctrl+Z）" class="screenshot-overlay__button" disabled="" title="撤销（Ctrl+Z）" type="button">
            <svg aria-hidden="true" class="lucide lucide-undo2 lucide-undo-2" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg">
              <path d="M9 14 4 9l5-5"></path>
              <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"></path>
            </svg>
          </button>
          <button aria-label="重做（Ctrl+Y）" class="screenshot-overlay__button" disabled="" title="重做（Ctrl+Y）" type="button">
            <svg aria-hidden="true" class="lucide lucide-redo2 lucide-redo-2" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg">
              <path d="m15 14 5-5-5-5"></path>
              <path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13"></path>
            </svg>
          </button>
          <span class="screenshot-overlay__separator"></span>
          <button aria-label="长截图（自动往下滚动拼接，也可以自己滚）" class="screenshot-overlay__button" title="长截图（自动往下滚动拼接，也可以自己滚）" type="button">
            <svg aria-hidden="true" class="lucide lucide-square-bottom-dashed-scissors" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg">
              <line x1="5" x2="19" y1="3" y2="3"></line>
              <line x1="3" x2="3" y1="5" y2="19"></line>
              <line x1="21" x2="21" y1="5" y2="19"></line>
              <line x1="9" x2="10" y1="21" y2="21"></line>
              <line x1="14" x2="15" y1="21" y2="21"></line>
              <path d="M 3 5 A2 2 0 0 1 5 3"></path>
              <path d="M 19 3 A2 2 0 0 1 21 5"></path>
              <path d="M 5 21 A2 2 0 0 1 3 19"></path>
              <path d="M 21 19 A2 2 0 0 1 19 21"></path>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <line x1="9.56066" x2="12" y1="9.56066" y2="12"></line>
              <line x1="17" x2="14.82" y1="17" y2="14.82"></line>
              <circle cx="8.5" cy="15.5" r="1.5"></circle>
              <line x1="9.56066" x2="17" y1="14.43934" y2="7"></line>
            </svg>
          </button>
          <button aria-label="自动打码（邮箱、手机号、IP、密钥）" class="screenshot-overlay__button" title="自动打码（邮箱、手机号、IP、密钥）" type="button">
            <svg aria-hidden="true" class="lucide lucide-eye-off" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg">
              <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path>
              <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path>
              <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path>
              <path d="m2 2 20 20"></path>
            </svg>
          </button>
          <button aria-label="识别文字" class="screenshot-overlay__button" title="识别文字" type="button">
            <svg aria-hidden="true" class="lucide lucide-scan-text" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
              <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
              <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
              <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
              <path d="M7 8h8"></path>
              <path d="M7 12h10"></path>
              <path d="M7 16h6"></path>
            </svg>
          </button>
          <button aria-label="贴到屏幕上（T）" class="screenshot-overlay__button" title="贴到屏幕上（T）" type="button">
            <svg aria-hidden="true" class="lucide lucide-pin" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 17v5"></path>
              <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"></path>
            </svg>
          </button>
          <button aria-label="保存（Ctrl+S）" class="screenshot-overlay__button" title="保存（Ctrl+S）" type="button">
            <svg aria-hidden="true" class="lucide lucide-download" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 15V3"></path>
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <path d="m7 10 5 5 5-5"></path>
            </svg>
          </button>
          <button aria-label="取消（Esc）" class="screenshot-overlay__button" title="取消（Esc）" type="button">
            <svg aria-hidden="true" class="lucide lucide-x" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg">
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
          </button>
          <button aria-label="复制（Enter）" class="screenshot-overlay__button screenshot-overlay__button--primary" title="复制（Enter）" type="button">
            <svg aria-hidden="true" class="lucide lucide-check" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg">
              <path d="M20 6 9 17l-5-5"></path>
            </svg>
          </button>
        </div>
      </div>
      <div class="screenshot-overlay__guide screenshot-overlay__guide--h" style="top: 40px"></div>
      <div class="screenshot-overlay__guide screenshot-overlay__guide--h" style="top: 119px"></div>
      <div class="screenshot-overlay__guide screenshot-overlay__guide--v" style="left: 40px"></div>
      <div class="screenshot-overlay__guide screenshot-overlay__guide--v" style="left: 119px"></div>
      <div aria-hidden="true" class="screenshot-magnifier" style="left: 170px; top: 140px">
        <canvas class="screenshot-magnifier__zoom" height="120" style="width: 120px; height: 120px" width="120"></canvas>
        <div class="screenshot-magnifier__color">
          <span class="screenshot-magnifier__swatch" style="background: rgb(250, 250, 250)"></span>
          #FAFAFA
        </div>
        <div class="screenshot-magnifier__line">
          150, 120
        </div>
        <div class="screenshot-magnifier__line">
          80 × 80
        </div>
        <div class="screenshot-magnifier__line">
          按 C 复制颜色
        </div>
        <div class="screenshot-magnifier__line">
          按住 M 测量距离
        </div>
      </div>
    </div>
  </div>
</body>
