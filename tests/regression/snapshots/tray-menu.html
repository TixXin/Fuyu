            <span>
              <b>
                岛屿
              </b>
              <small>
                显示中
              </small>
            </span>
          </button>
          <button aria-label="截图，Ctrl+Shift+1" class="tray-card__tile" title="截图  Ctrl+Shift+1" type="button">
            <svg aria-hidden="true" class="lucide lucide-scan-line" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
              <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
              <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
              <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
              <path d="M7 12h10"></path>
            </svg>
            <span class="tray-card__label">
              截图
            </span>
            <kbd>
              Ctrl+Shift+1
            </kbd>
          </button>
          <button aria-disabled="true" aria-label="翻译，已关闭" class="tray-card__tile tray-card__tile--off" title="已关闭，去 设置 → 翻译 里打开" type="button">
            <svg aria-hidden="true" class="lucide lucide-languages" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
              <path d="m5 8 6 6"></path>
              <path d="m4 14 6-6 2-3"></path>
              <path d="M2 5h12"></path>
              <path d="M7 2h1"></path>
              <path d="m22 22-5-10-5 10"></path>
              <path d="M14 18h6"></path>
            </svg>
            <span class="tray-card__label">
              翻译
            </span>
            <span class="tray-card__off">
              已关闭
            </span>
          </button>
          <button aria-label="剪贴板，Ctrl+Shift+W" class="tray-card__tile" title="剪贴板  Ctrl+Shift+W" type="button">
            <svg aria-hidden="true" class="lucide lucide-clipboard" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
              <rect height="4" rx="1" ry="1" width="8" x="8" y="2"></rect>
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
            </svg>
            <span class="tray-card__label">
              剪贴板
            </span>
            <kbd>
              Ctrl+Shift+W
            </kbd>
          </button>
        </div>
        <div class="tray-card__strip">
          <span class="tray-card__strip-label">
            打开
          </span>
          <button aria-label="打开待办" class="tray-card__icon-button" title="待办" type="button">
            <svg aria-hidden="true" class="lucide lucide-list-todo" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
              <path d="M13 5h8"></path>
              <path d="M13 12h8"></path>
              <path d="M13 19h8"></path>
              <path d="m3 17 2 2 4-4"></path>
              <rect height="6" rx="1" width="6" x="3" y="4"></rect>
            </svg>
          </button>
          <button aria-label="打开笔记" class="tray-card__icon-button" title="笔记" type="button">
            <svg aria-hidden="true" class="lucide lucide-notebook-pen" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
              <path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4"></path>
              <path d="M2 6h4"></path>
              <path d="M2 10h4"></path>
              <path d="M2 14h4"></path>
              <path d="M2 18h4"></path>
              <path d="M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"></path>
            </svg>
          </button>
          <button aria-label="打开日历" class="tray-card__icon-button" title="日历" type="button">
            <svg aria-hidden="true" class="lucide lucide-calendar-days" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
              <path d="M8 2v4"></path>
              <path d="M16 2v4"></path>
              <rect height="18" rx="2" width="18" x="3" y="4"></rect>
              <path d="M3 10h18"></path>
              <path d="M8 14h.01"></path>
              <path d="M12 14h.01"></path>
              <path d="M16 14h.01"></path>
              <path d="M8 18h.01"></path>
              <path d="M12 18h.01"></path>
              <path d="M16 18h.01"></path>
            </svg>
          </button>
          <button aria-label="打开文件中转" class="tray-card__icon-button" title="文件中转" type="button">
            <svg aria-hidden="true" class="lucide lucide-folder-up" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
              <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path>
              <path d="M12 10v6"></path>
              <path d="m9 13 3-3 3 3"></path>
            </svg>
          </button>
          <button aria-label="打开AI 代理" class="tray-card__icon-button" title="AI 代理" type="button">
            <svg aria-hidden="true" class="lucide lucide-bot" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 8V4H8"></path>
              <rect height="12" rx="2" width="16" x="4" y="8"></rect>
              <path d="M2 14h2"></path>
              <path d="M20 14h2"></path>
              <path d="M15 13v2"></path>
              <path d="M9 13v2"></path>
            </svg>
          </button>
        </div>
        <div class="tray-card__switches">
          <button aria-checked="false" class="tray-card__switch" role="switch" type="button">
            <svg aria-hidden="true" class="lucide lucide-gamepad2 lucide-gamepad-2" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
              <line x1="6" x2="10" y1="11" y2="11"></line>
              <line x1="8" x2="8" y1="9" y2="13"></line>
              <line x1="15" x2="15.01" y1="12" y2="12"></line>
              <line x1="18" x2="18.01" y1="10" y2="10"></line>

            </svg>
            <span class="tray-card__switch-label">
              游戏勿扰
            </span>
            <span aria-hidden="true" class="tray-card__track">
              <span class="tray-card__knob"></span>
            </span>
          </button>
          <button aria-checked="false" class="tray-card__switch" role="switch" type="button">
            <svg aria-hidden="true" class="lucide lucide-clipboard-x" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
              <rect height="4" rx="1" ry="1" width="8" x="8" y="2"></rect>
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <path d="m15 11-6 6"></path>
              <path d="m9 11 6 6"></path>
            </svg>
            <span class="tray-card__switch-label">
              暂停剪贴板记录
            </span>
            <span aria-hidden="true" class="tray-card__track">
              <span class="tray-card__knob"></span>
            </span>
          </button>
          <button aria-checked="true" class="tray-card__switch" role="switch" type="button">
            <svg aria-hidden="true" class="lucide lucide-zap" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"></path>
            </svg>
            <span class="tray-card__switch-label">
              开机自启
            </span>
            <span aria-hidden="true" class="tray-card__track">
              <span class="tray-card__knob"></span>
            </span>
          </button>
        </div>
        <div class="tray-card__foot">
          <span class="tray-card__spacer"></span>
          <button aria-label="重启" class="tray-card__foot-button" type="button">
            <svg aria-hidden="true" class="lucide lucide-rotate-ccw" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <path d="M3 3v5h5"></path>
            </svg>
            <span class="tray-card__foot-text">
              重启
            </span>
          </button>
          <button aria-label="退出" class="tray-card__foot-button tray-card__foot-button--danger" type="button">
            <svg aria-hidden="true" class="lucide lucide-power" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2v10"></path>
              <path d="M18.4 6.6a9 9 0 1 1-12.77.04"></path>
            </svg>
            <span class="tray-card__foot-text">
              退出
            </span>
          </button>
        </div>
      </div>
    </div>
  </div>
