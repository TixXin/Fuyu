            </span>
            <span class="tray-card__off">
              已关闭
            </span>
          </button>
          <button aria-label="剪贴板，Ctrl+Shift+W" class="tray-card__tile" title="剪贴板  Ctrl+Shift+W" type="button">
            <svg aria-hidden="true" class="lucide lucide-clipboard" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"></svg>
            <span class="tray-card__label">
              剪贴板
            </span>
            <kbd>
              Ctrl+Shift+W
            </kbd>
          </button>
        </div>
        <div class="tray-card__strip">
          <span class="tray-card__strip-label">
            打开
          </span>
          <button aria-label="打开待办" class="tray-card__icon-button" title="待办" type="button">
            <svg aria-hidden="true" class="lucide lucide-list-todo" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"></svg>
          </button>
          <button aria-label="打开笔记" class="tray-card__icon-button" title="笔记" type="button">
            <svg aria-hidden="true" class="lucide lucide-notebook-pen" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"></svg>
          </button>
          <button aria-label="打开日历" class="tray-card__icon-button" title="日历" type="button">
            <svg aria-hidden="true" class="lucide lucide-calendar-days" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"></svg>
          </button>
          <button aria-label="打开文件中转" class="tray-card__icon-button" title="文件中转" type="button">
            <svg aria-hidden="true" class="lucide lucide-folder-up" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"></svg>
          </button>
          <button aria-label="打开AI 代理" class="tray-card__icon-button" title="AI 代理" type="button">
            <svg aria-hidden="true" class="lucide lucide-bot" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"></svg>
          </button>
        </div>
        <div class="tray-card__switches">
          <button aria-checked="false" class="tray-card__switch" role="switch" type="button">
            <svg aria-hidden="true" class="lucide lucide-gamepad2 lucide-gamepad-2" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"></svg>
            <span class="tray-card__switch-label">
              游戏勿扰
            </span>
            <span aria-hidden="true" class="tray-card__track">
              <span class="tray-card__knob"></span>
            </span>
          </button>
          <button aria-checked="false" class="tray-card__switch" role="switch" type="button">
            <svg aria-hidden="true" class="lucide lucide-clipboard-x" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"></svg>
            <span class="tray-card__switch-label">
              暂停剪贴板记录
            </span>
            <span aria-hidden="true" class="tray-card__track">
              <span class="tray-card__knob"></span>
            </span>
          </button>
          <button aria-checked="true" class="tray-card__switch" role="switch" type="button">
            <svg aria-hidden="true" class="lucide lucide-zap" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"></svg>
            <span class="tray-card__switch-label">
              开机自启
            </span>
            <span aria-hidden="true" class="tray-card__track">
              <span class="tray-card__knob"></span>
            </span>
          </button>
        </div>
        <div class="tray-card__foot">
          <span class="tray-card__spacer"></span>
          <button aria-label="重启" class="tray-card__foot-button" type="button">
            <svg aria-hidden="true" class="lucide lucide-rotate-ccw" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"></svg>
            <span class="tray-card__foot-text">
              重启
            </span>
          </button>
          <button aria-label="退出" class="tray-card__foot-button tray-card__foot-button--danger" type="button">
            <svg aria-hidden="true" class="lucide lucide-power" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"></svg>
            <span class="tray-card__foot-text">
              退出
            </span>
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
