<body>
  <main>
    <div class="box" id="marks">
      <span aria-hidden="true" class="dev-watermark dev-watermark--collapsed">
        DEV
      </span>
      <span aria-hidden="true" class="dev-watermark dev-watermark--panel">
        DEV
      </span>
    </div>
    <div id="rows">
      <section class="settings-group">
        <div class="settings-group__header">
          <h2 class="settings-group__title">
            启动与语言
          </h2>
        </div>
        <div class="settings-group__card">
          <div class="settings-row">
            <div class="settings-row__main">
              <div class="settings-row__text">
                <label class="settings-row__title" for="_id1_">
                  开机自启动
                </label>
                <span class="settings-row__description">
                  这是开发版，不改开机自启。请在安装的正式版里设置。
                </span>
              </div>
              <div class="settings-row__control">
                <span class="settings-switch">
                  <input disabled="" id="_id1_" role="switch" type="checkbox">
                  <span aria-hidden="true" class="settings-switch__track"></span>
                </span>
              </div>
            </div>
          </div>
          <div class="settings-row">
            <div class="settings-row__main">
              <div class="settings-row__text">
                <label class="settings-row__title" for="_id2_">
                  在托盘显示图标
                </label>
              </div>
              <div class="settings-row__control">
                <span class="settings-switch">
                  <input checked="" id="_id2_" role="switch" type="checkbox">
                  <span aria-hidden="true" class="settings-switch__track"></span>
                </span>
              </div>
            </div>
          </div>
          <div class="settings-row settings-row--indent">
            <div class="settings-row__main">
              <div class="settings-row__text">
                <span class="settings-row__title">
                  托盘卡片样式
                </span>
                <span class="settings-row__description">
                  点托盘图标（左键或右键）弹出的卡片。
                </span>
              </div>
            </div>
            <fieldset class="tray-card-layout">
              <div aria-label="托盘卡片样式" class="settings-cards" role="group">
                <button aria-pressed="true" class="settings-cards__card settings-cards__card--active" type="button">
                  <span aria-hidden="true" class="settings-cards__art">
                    <span class="tray-card-glyph">
                      <span class="tray-card-glyph__head"></span>
                      <span class="tray-card-glyph__tiles"></span>
                      <span class="tray-card-glyph__strip"></span>
                      <span class="tray-card-glyph__line"></span>
                      <span class="tray-card-glyph__line"></span>
                      <span class="tray-card-glyph__foot"></span>
                    </span>
                  </span>
                  <span class="settings-cards__text">
                    <span class="settings-cards__label">
                      入口型
                    </span>
                    <span class="settings-cards__hint">
                      常用功能一眼都在
                    </span>
                  </span>
                  <svg aria-hidden="true" class="lucide lucide-check settings-cards__check" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" viewBox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg"></svg>
                </button>
                <button aria-pressed="false" class="settings-cards__card" type="button">
                  <span aria-hidden="true" class="settings-cards__art">
                    <span class="tray-card-glyph">
                      <span class="tray-card-glyph__head"></span>
                      <span class="tray-card-glyph__block"></span>
                      <span class="tray-card-glyph__block"></span>
                      <span class="tray-card-glyph__pills"></span>
                      <span class="tray-card-glyph__foot"></span>
                    </span>
                  </span>
                  <span class="settings-cards__text">
                    <span class="settings-cards__label">
                      状态型
                    </span>
                    <span class="settings-cards__hint">
                      看歌、会议和 Agent
                    </span>
                  </span>
                </button>
                <button aria-pressed="false" class="settings-cards__card" type="button">
                  <span aria-hidden="true" class="settings-cards__art">
                    <span class="tray-card-glyph">
                      <span class="tray-card-glyph__head"></span>
                      <span class="tray-card-glyph__tiles"></span>
                      <span class="tray-card-glyph__line"></span>
                      <span class="tray-card-glyph__line"></span>
                    </span>
                  </span>
                  <span class="settings-cards__text">
                    <span class="settings-cards__label">
                      精简型
                    </span>
                    <span class="settings-cards__hint">
                      最小最快
                    </span>
                  </span>
                </button>
              </div>
            </fieldset>
          </div>
          <div class="settings-row">
            <div class="settings-row__main">
              <div class="settings-row__text">
                <span class="settings-row__title">
                  界面语言
                </span>
              </div>
              <div class="settings-row__control">
                <div class="settings-select">
                  <div class="select-control">
                    <button aria-controls="_id3_" aria-expanded="false" aria-haspopup="listbox" aria-label="界面语言" class="select-control__trigger" role="combobox" type="button">
                      <span>
                        简体中文
                      </span>
                      <svg aria-hidden="true" class="lucide lucide-chevron-down select-control__chevron" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg"></svg>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
      <a class="project-link project-link--release" href="https://fuyu.ing/releases/" rel="noopener noreferrer" target="_blank">
        <svg aria-hidden="true" class="lucide lucide-download project-link__icon" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg"></svg>
        <span class="project-link__copy">
          <strong>
            查看最新版本
          </strong>
          <span>
            这是开发版，不检查也不安装更新。新版本请在安装的正式版里更新。
          </span>
        </span>
        <svg aria-hidden="true" class="lucide lucide-external-link project-link__arrow" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg"></svg>
      </a>
      <div id="bar" style="position: relative; height: 40px">
        <div class="dev-bar">
          <span aria-hidden="true" class="dev-bar__mark">
            DEV
          </span>
          <div aria-label="快捷键和提醒归谁" class="settings-choice" role="group">
            <button aria-pressed="false" class="settings-choice__option" type="button">
              正式版优先
            </button>
            <button aria-pressed="true" class="settings-choice__option settings-choice__option--active" type="button">
              开发版优先
            </button>
          </div>
          <span class="dev-bar__status" role="status">
            正式版已让出，审批也到这里
          </span>
        </div>
      </div>
      <div id="hooks">
        <section class="settings-group">
          <div class="settings-group__header">
            <h2 class="settings-group__title">
              AI Agent 状态灯
            </h2>
          </div>
          <div class="settings-group__card">
            <div class="agent-hooks-card agent-hooks-card--warn">
              <div class="agent-hooks-card__row">
                <span class="agent-hooks-card__icon">
                  <svg aria-hidden="true" class="lucide lucide-circle-alert" fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" viewBox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg"></svg>
                </span>
                <div class="agent-hooks-card__copy">
                  <div class="agent-hooks-card__headline">
                    <span class="agent-hooks-card__label">
                      当前状态
                    </span>
                    <strong class="agent-hooks-value">
                      AI Agent 空闲或已完成
                    </strong>
                  </div>
                  <span class="agent-hooks-message agent-hooks-message--attention" role="status">
                    <svg aria-hidden="true" class="lucide lucide-circle-alert" fill="none" height="13" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewBox="0 0 24 24" width="13" xmlns="http://www.w3.org/2000/svg"></svg>
                    还没有安装钩子。点“安装/修复”后重启正在用的 AI Agent，状态灯和会话标题才会工作。
                  </span>
                </div>
                <div class="agent-hooks-card__actions">
                  <button class="settings-link-button agent-hooks-card__button agent-hooks-card__button--primary" type="button">
                    安装/修复
                  </button>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>
</body>
