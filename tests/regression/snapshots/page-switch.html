<body>
  <div id="root">
    <main class="settings-stage stage--font-system">
      <div class="settings-layout" data-tauri-drag-region="true">
        <div class="window-buttons">
          <button aria-label="最小化" class="window-buttons__button" type="button">
            <svg aria-hidden="true" class="lucide lucide-minus" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" viewBox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg"></svg>
          </button>
          <button aria-label="最大化" class="window-buttons__button" type="button">
            <svg aria-hidden="true" class="lucide lucide-square" fill="none" height="11" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" viewBox="0 0 24 24" width="11" xmlns="http://www.w3.org/2000/svg"></svg>
          </button>
          <button aria-label="关闭" class="window-buttons__button window-buttons__button--close" type="button">
            <svg aria-hidden="true" class="lucide lucide-x" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" viewBox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg"></svg>
          </button>
        </div>
        <div class="settings-sidebar-card" data-tauri-drag-region="true">
          <nav aria-label="设置分类" class="settings-sidebar">
            <div class="settings-sidebar__search">
              <svg aria-hidden="true" class="lucide lucide-search" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg"></svg>
              <input aria-label="搜索设置" placeholder="搜索设置" spellcheck="false" type="text" value="开机">
              <button aria-label="清除搜索" class="settings-sidebar__search-clear" type="button">
                <svg aria-hidden="true" class="lucide lucide-x" fill="none" height="13" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="13" xmlns="http://www.w3.org/2000/svg"></svg>
              </button>
            </div>
            <div class="settings-sidebar__list">
              <section aria-label="基础" class="settings-sidebar__group">
                <button aria-expanded="true" aria-label="折叠「基础」" class="settings-sidebar__folder settings-sidebar__folder--holds-active" data-group="basics" disabled="" type="button">
                  <svg aria-hidden="true" class="lucide lucide-settings2 lucide-settings-2" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"></svg>
                  <span>
                    基础
                  </span>
                  <svg aria-hidden="true" class="lucide lucide-chevron-right settings-sidebar__chevron" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg"></svg>
                </button>
                <ul class="settings-sidebar__children">
                  <li>
                    <button aria-current="page" class="settings-sidebar__item settings-sidebar__item--nested settings-sidebar__item--active" data-category="general" type="button">
                      <svg aria-hidden="true" class="lucide lucide-sliders-horizontal" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"></svg>
                      <span>
                        通用
                      </span>
                    </button>
                    <ul class="settings-sidebar__hits">
                      <li>
                        <button class="settings-sidebar__hit settings-sidebar__hit--tab" data-tab="general" type="button">
                          <span>
                            启动与托盘
                          </span>
                        </button>
                      </li>
                      <li>
                        <button class="settings-sidebar__hit" data-page="general" title="通用 › 启动与托盘 › 启动与语言 › 开机自启动" type="button">
                          <span>
                            开机自启动
                          </span>
                        </button>
                      </li>
                    </ul>
                  </li>
                </ul>
              </section>
            </div>
          </nav>
        </div>
        <div class="settings-content">
          <div class="settings-page__header" data-tauri-drag-region="true">
            <h1 class="settings-page__title" data-tauri-drag-region="true">
              通用
            </h1>
          </div>
          <div aria-label="通用" class="settings-tabs" data-tauri-drag-region="true" role="tablist">
            <button aria-selected="true" class="settings-tabs__tab settings-tabs__tab--active" data-tab="general" role="tab" tabindex="0" type="button">
              启动与托盘
            </button>
            <button aria-selected="false" class="settings-tabs__tab" data-tab="generalData" role="tab" tabindex="-1" type="button">
              数据与备份
            </button>
            <button aria-selected="false" class="settings-tabs__tab" data-tab="generalSync" role="tab" tabindex="-1" type="button">
              跨设备同步
            </button>
          </div>
          <div class="editor-panel">
            <section class="settings-group">
              <div class="settings-group__header">
                <h2 class="settings-group__title">
                  启动与语言
                </h2>
              </div>
              <div class="settings-group__card">
                <div class="settings-row">
                  <div class="settings-row__main">
                    <div class="settings-row__text">
                      <label class="settings-row__title" for="_id1_">
                        开机自启动
                      </label>
                    </div>
                    <div class="settings-row__control">
                      <span class="settings-switch">
                        <input id="_id1_" role="switch" type="checkbox">
                        <span aria-hidden="true" class="settings-switch__track"></span>
                      </span>
                    </div>
                  </div>
                </div>
                <div class="settings-row">
                  <div class="settings-row__main">
                    <div class="settings-row__text">
                      <label class="settings-row__title" for="_id2_">
                        在托盘显示图标
                      </label>
                      <span class="settings-row__description">
                        图标隐藏后，从开始菜单或桌面快捷方式再次打开浮屿，会弹出这一页。
                      </span>
                    </div>
                    <div class="settings-row__control">
                      <span class="settings-switch">
                        <input checked="" id="_id2_" role="switch" type="checkbox">
                        <span aria-hidden="true" class="settings-switch__track"></span>
                      </span>
                    </div>
                  </div>
                </div>
                <div class="settings-row settings-row--indent">
                  <div class="settings-row__main">
                    <div class="settings-row__text">
                      <span class="settings-row__title">
                        托盘卡片样式
                      </span>
                      <span class="settings-row__description">
                        托盘图标隐藏时用不到卡片。
                      </span>
                    </div>
                  </div>
                  <fieldset class="tray-card-layout" disabled="">
                    <div aria-label="托盘卡片样式" class="settings-cards" role="group" style="--cards-columns: 3">
                      <button aria-pressed="true" class="settings-cards__card settings-cards__card--active" type="button">
                        <span aria-hidden="true" class="settings-cards__art">
                          <span class="tray-card-glyph">
                            <span class="tray-card-glyph__head"></span>
                            <span class="tray-card-glyph__tiles"></span>
                            <span class="tray-card-glyph__strip"></span>
                            <span class="tray-card-glyph__line"></span>
                            <span class="tray-card-glyph__line"></span>
                            <span class="tray-card-glyph__foot"></span>
                          </span>
                        </span>
                        <span class="settings-cards__text">
                          <span class="settings-cards__label">
                            入口型
                          </span>
                          <span class="settings-cards__hint">
                            常用功能一眼都在
                          </span>
                        </span>
                        <svg aria-hidden="true" class="lucide lucide-check settings-cards__check" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" viewBox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg"></svg>
                      </button>
                      <button aria-pressed="false" class="settings-cards__card" type="button">
                        <span aria-hidden="true" class="settings-cards__art">
                          <span class="tray-card-glyph">
                            <span class="tray-card-glyph__head"></span>
                            <span class="tray-card-glyph__block"></span>
                            <span class="tray-card-glyph__block"></span>
                            <span class="tray-card-glyph__pills"></span>
                            <span class="tray-card-glyph__foot"></span>
                          </span>
                        </span>
                        <span class="settings-cards__text">
                          <span class="settings-cards__label">
                            状态型
                          </span>
                          <span class="settings-cards__hint">
                            看歌、会议和 Agent
                          </span>
                        </span>
                      </button>
                      <button aria-pressed="false" class="settings-cards__card" type="button">
                        <span aria-hidden="true" class="settings-cards__art">
                          <span class="tray-card-glyph">
                            <span class="tray-card-glyph__head"></span>
                            <span class="tray-card-glyph__tiles"></span>
                            <span class="tray-card-glyph__line"></span>
                            <span class="tray-card-glyph__line"></span>
                          </span>
                        </span>
                        <span class="settings-cards__text">
                          <span class="settings-cards__label">
                            精简型
                          </span>
                          <span class="settings-cards__hint">
                            最小最快
                          </span>
                        </span>
                      </button>
                    </div>
                  </fieldset>
                </div>
                <div class="settings-row">
                  <div class="settings-row__main">
                    <div class="settings-row__text">
                      <span class="settings-row__title">
                        界面语言
                      </span>
                    </div>
                    <div class="settings-row__control">
                      <div class="settings-select">
                        <div class="select-control">
                          <button aria-controls="_id3_" aria-expanded="false" aria-haspopup="listbox" aria-label="界面语言" class="select-control__trigger" role="combobox" type="button">
                            <span>
                              简体中文
                            </span>
                            <svg aria-hidden="true" class="lucide lucide-chevron-down select-control__chevron" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg"></svg>
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </section>
            <section class="settings-group">
              <div class="settings-group__header">
                <h2 class="settings-group__title">
                  网络代理
                </h2>
                <button class="settings-link-button" type="button">
                  测试连接
                </button>
              </div>
              <div class="settings-group__card">
                <div class="settings-row">
                  <div class="settings-row__main">
                    <div class="settings-row__text">
                      <span class="settings-row__title">
                        代理模式
                      </span>
                      <span class="settings-row__description">
                        <span class="network-proxy__detected">
                          <span>
                            已检测到系统代理
                          </span>
                          <code class="network-proxy__code">
                            http://127.0.0.1:7890
                          </code>
                        </span>
                      </span>
                    </div>
                    <div class="settings-row__control">
                      <div aria-label="代理模式" class="settings-choice" role="group">
                        <button aria-pressed="true" class="settings-choice__option settings-choice__option--active" type="button">
                          跟随系统
                        </button>
                        <button aria-pressed="false" class="settings-choice__option" type="button">
                          手动代理
                        </button>
                        <button aria-pressed="false" class="settings-choice__option" type="button">
                          不使用代理
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="settings-group__footer">
                <p class="settings-footnote">
                  适用于插件市场、插件联网、邮箱、日历、应用更新、主题市场、同步与翻译。
                  <button aria-expanded="false" class="settings-footnote__toggle" type="button">
                    了解更多
                  </button>
                </p>
              </div>
            </section>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
