<body>
  <div id="panel">
    <section aria-label="日历" class="calendar-panel">
      <div class="calendar-empty">
        <svg aria-hidden="true" class="lucide lucide-calendar-plus calendar-empty__icon" fill="none" height="26" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" width="26" xmlns="http://www.w3.org/2000/svg"></svg>
        <strong>
          还没有日历
        </strong>
        <span class="calendar-empty__hint">
          订阅中国节假日不用账号，点一下就有；飞书、钉钉、企业微信等工作日历在设置里添加。也可以直接写以时间开头的待办，例如「15:00 周会」。
        </span>
        <div class="calendar-empty__actions">
          <button class="calendar-empty__primary" type="button">
            订阅中国节假日
          </button>
          <button class="calendar-empty__secondary" type="button">
            添加工作日历
          </button>
        </div>
      </div>
    </section>
  </div>
  <div id="line">
    <span class="island-meeting island-meeting--started">
      <svg aria-hidden="true" class="lucide lucide-calendar-clock island-meeting__icon" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg"></svg>
      <span class="island-meeting__title">
        会议
      </span>
      <span class="island-meeting__when">
        ·
        已开始
      </span>
    </span>
  </div>
  <div id="settings">
    <section class="settings-group">
      <div class="settings-group__header">
        <h2 class="settings-group__title">
          已添加的日历
        </h2>
        <button class="settings-link-button" disabled="" type="button">
          已订阅节假日
        </button>
      </div>
      <div class="settings-group__card">
        <div class="settings-row" data-search="off">
          <div class="settings-row__main">
            <div class="settings-row__text">
              <span class="settings-row__title">
                飞书
              </span>
              <span class="settings-row__description">
                u_new · caldav.feishu.cn
              </span>
            </div>
            <div class="settings-row__control">
              <button aria-label="删除日历「飞书」" class="calendar-source__remove" type="button">
                <svg aria-hidden="true" class="lucide lucide-trash2 lucide-trash-2" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg"></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="settings-row" data-search="off">
          <div class="settings-row__main">
            <div class="settings-row__text">
              <span class="settings-row__title">
                Google 日历
              </span>
              <span class="settings-row__description">
                订阅 · calendar.google.com
              </span>
            </div>
            <div class="settings-row__control">
              <button aria-label="删除日历「Google 日历」" class="calendar-source__remove" type="button">
                <svg aria-hidden="true" class="lucide lucide-trash2 lucide-trash-2" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg"></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="settings-row" data-search="off">
          <div class="settings-row__main">
            <div class="settings-row__text">
              <span class="settings-row__title">
                中国节假日
              </span>
              <span class="settings-row__description">
                订阅 · calendars.icloud.com
              </span>
            </div>
            <div class="settings-row__control">
              <button aria-label="删除日历「中国节假日」" class="calendar-source__remove" type="button">
                <svg aria-hidden="true" class="lucide lucide-trash2 lucide-trash-2" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg"></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="settings-row">
          <div class="settings-row__main">
            <div class="settings-row__text">
              <span class="settings-row__title">
                用的是
              </span>
            </div>
            <div class="settings-row__control">
              <div class="settings-select">
                <div class="select-control">
                  <button aria-controls="_id1_" aria-expanded="false" aria-haspopup="listbox" aria-label="用的是" class="select-control__trigger" role="combobox" type="button">
                    <span>
                      其他
                    </span>
                    <svg aria-hidden="true" class="lucide lucide-chevron-down select-control__chevron" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg"></svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="calendar-form">
          <ol class="calendar-form__steps">
            <li>
              粘贴日历服务器地址（CalDAV）或 .ics 订阅链接。
            </li>
            <li>
              是服务器地址时，再填账号和密码。
            </li>
          </ol>
          <label class="calendar-form__field">
            <span>
              地址或链接
            </span>
            <input autocomplete="off" placeholder="https://… 或 webcal://…" spellcheck="false" type="text" value="https://example.com/team.ics">
          </label>
          <label class="calendar-form__field">
            <span>
              名称（可不填）
            </span>
            <input autocomplete="off" placeholder="其他" spellcheck="false" type="text" value="">
          </label>
          <button class="calendar-form__add" type="button">
            读取并添加
          </button>
        </div>
      </div>
    </section>
  </div>
</body>
