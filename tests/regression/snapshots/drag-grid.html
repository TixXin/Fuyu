<body>
  <main>
    <div class="screen" id="lines">
      <div aria-hidden="true" class="drag-grid drag-grid--visible">
        <span class="drag-grid__line drag-grid__line--v"></span>
        <span class="drag-grid__line drag-grid__line--h"></span>
      </div>
    </div>
    <div class="screen" id="top">
      <div aria-hidden="true" class="drag-grid drag-grid--visible">
        <span class="drag-grid__line drag-grid__line--v"></span>
        <span class="drag-grid__line drag-grid__line--h"></span>
        <span class="drag-grid__snap drag-grid__snap--top"></span>
      </div>
    </div>
    <div class="screen screen--plain" id="left">
      <div aria-hidden="true" class="drag-grid drag-grid--visible">
        <span class="drag-grid__line drag-grid__line--v"></span>
        <span class="drag-grid__line drag-grid__line--h"></span>
        <span class="drag-grid__snap drag-grid__snap--left"></span>
      </div>
    </div>
    <div class="screen screen--plain" id="snap-only">
      <div aria-hidden="true" class="drag-grid drag-grid--visible">
        <span class="drag-grid__snap drag-grid__snap--bottom"></span>
      </div>
    </div>
  </main>
  <div id="window-frame"></div>
</body>
