<!doctype html>
<html lang="zh-CN">
  <meta charset="UTF-8" />
  <title>插件（第 3 版）设置页检查</title>
  <style>
    * { box-sizing: border-box; }
    html body { height: auto; min-height: 100%; margin: 0; overflow: auto; background: #17191d; color: #eee; font: 14px "Segoe UI", "Microsoft YaHei", sans-serif; }
    main { display: grid; grid-template-columns: 172px minmax(0, 1fr); gap: 16px; max-width: 980px; padding: 24px; }
    #sidebar { height: 640px; display: grid; }
    #page { min-width: 0; color: var(--text-1); }
    #narrow { width: 300px; margin: 0 24px; color: var(--text-1); }
    #results { max-width: 760px; margin: 24px; color: #ccc; font-size: 13px; line-height: 1.8; white-space: pre-wrap; }
  </style>
  <main>
    <div id="sidebar"></div>
    <div id="page"></div>
  </main>
  <div id="narrow"></div>
  <pre id="results" role="status">准备检查…</pre>
  <script type="module" src="./plugins-v3.tsx"></script>
</html>
