<!doctype html>
<html lang="zh-CN">
  <meta charset="UTF-8" />
  <title>拖动中线辅助线检查</title>
  <style>
    html body { margin: 0; background: #20242c; font: 14px "Segoe UI", "Microsoft YaHei", sans-serif; color: #f1f0f6; }
    main { display: grid; grid-template-columns: repeat(2, 480px); gap: 16px; padding: 16px; }
    .screen { position: relative; height: 270px; overflow: hidden; border-radius: 6px; transform: translateZ(0); background: linear-gradient(150deg, #1b3a7a, #2c64d8 55%, #f0c27a); }
    .screen--plain { background: #f4f4f6; }
    .screen .drag-grid { position: absolute; }
    #window-frame { display: none; }
    #results { max-width: 1000px; margin: 0 auto 24px; padding: 0 16px; font-size: 13px; line-height: 1.8; white-space: pre-wrap; }
  </style>
  <main>
    <div class="screen" id="lines"></div>
    <div class="screen" id="top"></div>
    <div class="screen screen--plain" id="left"></div>
    <div class="screen screen--plain" id="snap-only"></div>
  </main>
  <div id="window-frame"></div>
  <pre id="results" role="status">准备检查…</pre>
  <script type="module" src="./drag-grid.tsx"></script>
</html>
