<!doctype html>
<html lang="zh-CN">
  <meta charset="UTF-8" />
  <title>新消息横幅检查</title>
  <style>
    * { box-sizing: border-box; }
    html body { height: auto; min-height: 100%; margin: 0; overflow: auto; background: #c5cfcc; font: 14px "Segoe UI", "Microsoft YaHei", sans-serif; }
    #fixture { position: relative; height: 240px; }
    #fixture .stage { position: relative; width: 100%; height: 220px; }
    #controls, #results { max-width: 760px; margin: 24px auto; padding: 0 24px; color: #1b302a; }
    #controls { display: flex; gap: 8px; flex-wrap: wrap; }
    #controls button { padding: 8px 14px; border: 1px solid #5c766c; border-radius: 8px; color: inherit; background: #e8efeb; cursor: pointer; }
    #results { font-size: 13px; line-height: 1.8; white-space: pre-wrap; }
  </style>
  <div id="fixture"></div>
  <div id="controls"></div>
  <pre id="results" role="status">准备横幅检查…</pre>
  <script type="module" src="./message-banner.tsx"></script>
</html>
